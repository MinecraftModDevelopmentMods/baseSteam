def obsoleteForgeGradle2EclipseLaunches = [
        'SteamAdvantage_Client.launch': 'GradleStart',
        'SteamAdvantage_Server.launch': 'GradleStartServer'
]

eclipse {
    project {
        buildCommand 'org.eclipse.buildship.core.gradleprojectbuilder'
        natures 'org.eclipse.buildship.core.gradleprojectnature'
    }
    classpath {
        downloadSources = true
        downloadJavadoc = true
        file.whenMerged { model ->
            // Eclipse must not overwrite expanded metadata with src/main/resources templates.
            def rawResources = sourceSets.main.resources.srcDirs.collect { relativePath(it).replace('\\', '/') }
            model.entries.removeAll { entry ->
                entry instanceof org.gradle.plugins.ide.eclipse.model.SourceFolder
                        && (rawResources.contains(entry.path) || entry.path == 'build/resources/main')
            }
            def processed = new org.gradle.plugins.ide.eclipse.model.SourceFolder('build/resources/main', 'bin/main')
            processed.entryAttributes['gradle_scope'] = 'main'
            processed.entryAttributes['gradle_used_by_scope'] = 'main,test'
            model.entries.add(processed)
        }
    }
    synchronizationTasks 'verifyJavaSourceLayout', 'isolateEclipseProductionRuns'
}

