}

tasks.named('processResources', ProcessResources) {
    filteringCharset = 'UTF-8'
    inputs.properties([
            version: project.version,
            poweradvantage_version: project.poweradvantage_version,
            minecraft_version_range: project.minecraft_version_range,
            forge_version_range: project.forge_version_range,
            loader_version_range: project.loader_version_range
    ])
    filesMatching('META-INF/mods.toml') {
        expand version: project.version,
                poweradvantage_version: project.poweradvantage_version,
                minecraft_version_range: project.minecraft_version_range,
                forge_version_range: project.forge_version_range,
                loader_version_range: project.loader_version_range
    }
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
}

def committedPin = { String key, pattern ->
    Properties pins = new Properties()
    file('gradle.properties').withInputStream { pins.load(it) }
    String pinned = pins.getProperty(key, '')
    if (!(pinned ==~ pattern) || project.property(key) != pinned) {
        throw new GradleException("Supply the exact coordinated ${key} in gradle.properties; overrides are not accepted.")
    }
    pinned
}
def forgeCapabilityBootstrapJar = providers.gradleProperty('forgeCapabilityBootstrapJar')
        .map { file(it) }
        .orElse(file("${powerRoot}/build/unit-bootstrap/forge-native-unit-bootstrap.jar"))
def unitBootstrapSources = [
        poweradvantage_test_bootstrap_source_sha256: explicitJar('forgeCapabilityBootstrapSource') ?:
                file("${powerRoot}/test-rig/unit-bootstrap/ForgeCapabilityBootstrap.java"),
        poweradvantage_test_registry_source_sha256: explicitJar('forgeUnitRegistriesSource') ?:
                file("${powerRoot}/test-rig/unit-support/zone/moddev/mc/advantageworks/unit/ForgeUnitRegistries.java"),
        poweradvantage_test_loader_source_sha256: explicitJar('forge64UnitLoaderSource') ?:
                file("${powerRoot}/test-rig/unit-support/zone/moddev/mc/advantageworks/unit/Forge64UnitLoader.java")
]
def nativeUnitSupportDirectory = layout.buildDirectory.dir('native-unit-support-source')
def nativeUnitSupportSources = unitBootstrapSources.findAll {
    key, source -> key != 'poweradvantage_test_bootstrap_source_sha256'
}
def prepareNativeUnitSupport = tasks.register('prepareNativeUnitSupport', Sync) {
    from(nativeUnitSupportSources.values()) { into 'zone/moddev/mc/advantageworks/unit' }
    into nativeUnitSupportDirectory
    nativeUnitSupportSources.keySet().each { inputs.property(it, providers.gradleProperty(it)) }
    doFirst {
        nativeUnitSupportSources.each { key, source ->
            String expected = committedPin(key, /[A-F0-9]{64}/)
            if (!source.isFile() || MessageDigest.getInstance('SHA-256').digest(source.bytes)
                    .encodeHex().toString().toUpperCase(Locale.ROOT) != expected) {
                throw new GradleException("Native unit-support source pin mismatch: ${source}")
            }
        }
    }
}
sourceSets.test.java.srcDir(nativeUnitSupportDirectory)
tasks.named('compileTestJava') { dependsOn prepareNativeUnitSupport }

tasks.named('test', Test) {
    useJUnit()
    jvmArgs '-XX:ActiveProcessorCount=4'
    inputs.files(forgeCapabilityBootstrapJar)
    inputs.files(unitBootstrapSources.values())
    inputs.property('powerBootstrapSha256', providers.gradleProperty('poweradvantage_test_bootstrap_sha256'))
    unitBootstrapSources.keySet().each { inputs.property(it, providers.gradleProperty(it)) }
    doFirst {
        File bootstrapJar = forgeCapabilityBootstrapJar.getOrNull()
        if (bootstrapJar == null || !bootstrapJar.isFile()) {
            throw new GradleException('Supply the verified basePower test bootstrap via -PforgeCapabilityBootstrapJar=<path>')
        }
        String expectedHash = committedPin('poweradvantage_test_bootstrap_sha256', /[A-F0-9]{64}/)
        String actualHash = MessageDigest.getInstance('SHA-256').digest(bootstrapJar.bytes)
                .encodeHex().toString().toUpperCase(Locale.ROOT)
        if (actualHash != expectedHash) {
            throw new GradleException("basePower test bootstrap SHA-256 is ${actualHash}, expected ${expectedHash}")
        }
        unitBootstrapSources.each { key, source ->
            String expected = committedPin(key, /[A-F0-9]{64}/)
            if (!source.isFile() || MessageDigest.getInstance('SHA-256').digest(source.bytes)
                    .encodeHex().toString().toUpperCase(Locale.ROOT) != expected) {
                throw new GradleException("Missing or mismatched basePower test source: ${source} (expected ${expected})")
            }
            logger.lifecycle("basePower test source: ${source.canonicalPath} SHA-256 ${expected}")
        }
        new ZipFile(bootstrapJar).withCloseable { zip ->
            def manifest = new Manifest(zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF'))).mainAttributes
            if (manifest.getValue('Premain-Class') != 'zone.moddev.mc.advantageworks.unit.ForgeCapabilityBootstrap') {
                throw new GradleException('Unexpected native capability test bootstrap entry point')
            }
        }
        logger.lifecycle("basePower test bootstrap: ${bootstrapJar.canonicalPath} SHA-256 ${actualHash}")
        systemProperty 'basesteam.nativePackClasspath', sourceSets.test.runtimeClasspath.asPath
        systemProperty 'basesteam.nativePowerJar', powerAdvantageDeobfJar.canonicalPath
        jvmArgs "-javaagent:${bootstrapJar.canonicalPath}"
        jvmArgs '--add-opens', 'java.base/java.lang.invoke=ALL-UNNAMED'
    }
}
tasks.named('compileTestJava', JavaCompile) { options.compilerArgs.add('-proc:none') }
tasks.named('compileGameTestValidationJava', JavaCompile) { options.compilerArgs.add('-proc:none') }

def prepareEclipseResources = tasks.register('prepareEclipseResources') {
    group = 'ide'
    description = 'Copies Gradle-processed resources into Eclipse production output.'
