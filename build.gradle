import groovy.json.JsonSlurper
import java.nio.charset.StandardCharsets
import java.security.MessageDigest
import java.util.jar.Manifest
import java.util.zip.ZipFile
import org.apache.tools.ant.filters.FixCrLfFilter

plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.renamer' version '1.1.5'
    id 'net.minecraftforge.gradle' version '7.0.34'
}

group = project.mod_group
version = project.mod_version
base.archivesName = 'baseSteam'

def versionParts = project.mod_version.toString().tokenize('.')
if (versionParts.size() != 4 || !versionParts.every { it ==~ /\d+/ }) {
    throw new GradleException("mod_version must use Major.Minor.Bug.Target numeric form: ${project.mod_version}")
}
def minecraftVersionParts = project.minecraft_version.toString().tokenize('.')
if (minecraftVersionParts.size() < 2 || minecraftVersionParts.size() > 3
        || !minecraftVersionParts.every { it ==~ /\d+/ }) {
    throw new GradleException("minecraft_version must use major.minor or major.minor.patch numeric form: "
            + project.minecraft_version)
}
def minecraftPatch = minecraftVersionParts.size() == 3 ? minecraftVersionParts[2] : '0'
def expectedTargetVersion = "${minecraftVersionParts[0]}" \
        + "${minecraftVersionParts[1].padLeft(2, '0')}" \
        + "${minecraftPatch.padLeft(2, '0')}" \
        + project.loader_code
if (versionParts[3] != expectedTargetVersion) {
    throw new GradleException("mod_version target ${versionParts[3]} does not match "
            + "Minecraft ${project.minecraft_version} ${project.loader_name} target ${expectedTargetVersion}")
}

ext.functional_version = versionParts[0..2].join('.')
ext.display_version = project.mod_version
ext.release_tag = project.mod_version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(16)
        vendor = JvmVendorSpec.ADOPTIUM
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(16)
        vendor = JvmVendorSpec.ADOPTIUM
    }
    sourceCompatibility = JavaVersion.VERSION_16
    targetCompatibility = JavaVersion.VERSION_16
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '1000'])
}

tasks.withType(Javadoc).configureEach {
    failOnError = false
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addBooleanOption('notimestamp', true)
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    includeEmptyDirs = false
}

def archiveTextSuffixes = [
        '.cfg', '.css', '.html', '.info', '.java', '.js', '.json', '.lang',
        '.mcmeta', '.md', '.properties', '.toml', '.txt', '.xml'
]
def archiveTextPatterns = archiveTextSuffixes.collect { "**/*${it}".toString() }
archiveTextPatterns.addAll(['**/element-list', '**/package-list'])
def normalizeArchiveLineEndings = { details ->
    details.filter(FixCrLfFilter,
            eol: FixCrLfFilter.CrLf.newInstance('lf'),
            eof: FixCrLfFilter.AddAsisRemove.newInstance('asis'))
}

minecraft {
    mappings channel: project.mapping_channel, version: project.mapping_version
    String configuredRunDirectory = providers.gradleProperty('steamAdvantageRunDirectory')
            .getOrElse('run')
    def forgeRunModClassesDirectory = layout.buildDirectory.dir('forge-run-mod-classes/main')
    def forgeMainOutputPath = forgeRunModClassesDirectory.get().asFile.absolutePath
    def mainModClasses = "${mod_id}%%${forgeMainOutputPath}${File.pathSeparator}${mod_id}%%${forgeMainOutputPath}"
    def forge37RunTargets = [client: 'fmluserdevclient', server: 'fmluserdevserver', data: 'fmluserdevdata']
    runs {
        configureEach {
            jvmArgs '--add-opens', 'java.base/java.lang.invoke=ALL-UNNAMED'
            workingDir.convention layout.projectDirectory.dir(configuredRunDirectory)
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'info'
            mods { basesteam { source sourceSets.main } }
            environment 'target', forge37RunTargets[name]
            environment 'MCP_MAPPINGS', "${mapping_channel}_${mapping_version}"
            environment 'MCP_VERSION', mcp_version
            environment 'FORGE_VERSION', forge_version
            environment 'FORGE_GROUP', 'net.minecraftforge'
            environment 'MC_VERSION', minecraft_version
            environment 'MOD_CLASSES', mainModClasses
        }
        register('client')
        register('server') {
            args '--nogui'
        }
        register('data') {
            workingDir.convention layout.projectDirectory.dir('run-data')
            args '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/**'
}

def forgeRunModClassesDirectory = layout.buildDirectory.dir('forge-run-mod-classes/main')
def prepareForgeRunModClasses = tasks.register('prepareForgeRunModClasses', Sync) {
    group = 'ide'
    description = 'Merges classes and processed resources for Forge 1.17 launches.'
    dependsOn tasks.named('classes')
    from sourceSets.main.output
    into forgeRunModClassesDirectory
}
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(16)
        vendor = JvmVendorSpec.ADOPTIUM
    }
    if (name in ['runClient', 'runServer', 'runData']) {
        dependsOn prepareForgeRunModClasses
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    mavenCentral()
    maven {
        name = 'MinecraftLibraries'
        url = 'https://libraries.minecraft.net/'
    }
}

// Require explicit development jars so sibling builds cannot silently replace the inputs.
def requiredDeobfJar = { String property, String dependency ->
    File jarFile = providers.gradleProperty(property).map { file(it) }.getOrNull()
    if (jarFile == null || !jarFile.isFile()) {
        throw new GradleException("Supply the pinned ${dependency} development jar via -P${property}=<path>.")
    }
    jarFile
}
def powerAdvantageDeobfJar = requiredDeobfJar('powerAdvantageDeobfJar', 'basePower')
def baseMetalsDeobfJar = requiredDeobfJar('baseMetalsDeobfJar', 'Base Metals')
def oreSpawnDeobfJar = requiredDeobfJar('oreSpawnDeobfJar', 'OreSpawn')

dependencies {
    implementation minecraft.dependency(
            "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")
    // basePower is required at runtime but remains a separate mod jar.
    compileOnly files(powerAdvantageDeobfJar)
    runtimeOnly files(powerAdvantageDeobfJar)
    compileOnly files(baseMetalsDeobfJar)
    runtimeOnly files(baseMetalsDeobfJar)
    // Required transitively by the coordinated basePower/Base Metals development runtime.
    compileOnly files(oreSpawnDeobfJar)
    runtimeOnly files(oreSpawnDeobfJar)
    testImplementation 'junit:junit:4.13.2'
    testImplementation files(powerAdvantageDeobfJar, baseMetalsDeobfJar, oreSpawnDeobfJar)
}

tasks.named('processResources', ProcessResources) {
    filteringCharset = 'UTF-8'
    inputs.properties([
            version: project.version,
            minecraft_version_range: project.minecraft_version_range,
            forge_version_range: project.forge_version_range,
            loader_version_range: project.loader_version_range
    ])
    filesMatching('META-INF/mods.toml') {
        expand version: project.version,
                minecraft_version_range: project.minecraft_version_range,
                forge_version_range: project.forge_version_range,
                loader_version_range: project.loader_version_range
    }
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
}

def forgeCapabilityBootstrapJar = providers.gradleProperty('forgeCapabilityBootstrapJar').map { file(it) }
tasks.withType(Test).configureEach {
    inputs.files(forgeCapabilityBootstrapJar)
    doFirst {
        File bootstrapJar = forgeCapabilityBootstrapJar.getOrNull()
        if (bootstrapJar == null || !bootstrapJar.isFile()) {
            throw new GradleException('Supply the verified basePower test bootstrap via -PforgeCapabilityBootstrapJar=<path>')
        }
        new ZipFile(bootstrapJar).withCloseable { zip ->
            def manifest = new Manifest(zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF'))).mainAttributes
            if (manifest.getValue('Premain-Class') != 'zone.moddev.mc.advantageworks.unit.ForgeCapabilityBootstrap') {
                throw new GradleException('Unexpected native capability test bootstrap entry point')
            }
        }
        jvmArgs "-javaagent:${bootstrapJar.canonicalPath}"
    }
}

def prepareEclipseResources = tasks.register('prepareEclipseResources') {
    group = 'ide'
    description = 'Copies Gradle-processed resources into Eclipse production output.'
    dependsOn tasks.named('processResources')
    doLast {
        project.copy {
            from(layout.buildDirectory.dir('resources/main'))
            into(layout.projectDirectory.dir('bin/main'))
        }
    }
}

tasks.named('jar', Jar) {
    archiveClassifier = 'deobf'
    destinationDirectory = layout.buildDirectory.dir('libs-dev')
    exclude 'fernflower_abstract_parameter_names.txt'
    manifest {
        attributes([
                'Maven-Artifact'        : "${project.group}:${base.archivesName.get()}:${project.version}",
                'Specification-Title'   : project.mod_id,
                'Specification-Vendor'  : project.mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : base.archivesName.get(),
                'Implementation-Version': project.version,
                'Implementation-Vendor' : project.mod_authors,
                'Built-On-Java'         : project.java_version,
                'Built-On'              : "${project.minecraft_version}-${project.forge_version}"
        ])
    }
}

def renamedJar = renamer.classes(tasks.named('jar', Jar)) {
    map.from minecraft.dependency.toSrgFile
    archiveClassifier = 'renamed'
    output.set(layout.buildDirectory.file(
            "intermediates/renamed/${base.archivesName.get()}-${project.version}.jar"))
}

// Renamer adds an internal Fernflower parameter map. Repack its output so the
// public jar is deterministic and contains only the mod plus its own manifest.
def releaseJar = tasks.register('releaseJar', Jar) {
    dependsOn renamedJar
    archiveClassifier = null
    destinationDirectory = layout.buildDirectory.dir('libs')
    from({ zipTree(renamedJar.get().output.get().asFile) }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'fernflower_abstract_parameter_names.txt'
    }
    manifest {
        attributes([
                'Maven-Artifact'        : "${project.group}:${base.archivesName.get()}:${project.version}",
                'Specification-Title'   : project.mod_id,
                'Specification-Vendor'  : project.mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : base.archivesName.get(),
                'Implementation-Version': project.version,
                'Implementation-Vendor' : project.mod_authors,
                'Built-On-Java'         : project.java_version,
                'Built-On'              : "${project.minecraft_version}-${project.forge_version}"
        ])
    }
}

tasks.register('deobfJar') {
    group = 'build'
    description = 'Builds the deobfuscated development jar under build/libs-dev.'
    dependsOn tasks.named('jar')
}

tasks.named('compileJava') {
    dependsOn 'verifyNativeDevelopmentDependencies'
}

tasks.named('sourcesJar', Jar) {
    filteringCharset = 'UTF-8'
    includeEmptyDirs = false
    archiveClassifier = 'sources'
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
    manifest {
        attributes([
                'Maven-Artifact'        : "${project.group}:${base.archivesName.get()}:${project.version}:sources",
                'Implementation-Title'  : "${base.archivesName.get()}-sources",
                'Implementation-Version': project.version
        ])
    }
}

tasks.named('javadocJar', Jar) {
    filteringCharset = 'UTF-8'
    archiveClassifier = 'javadoc'
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
    manifest {
        attributes([
                'Maven-Artifact'        : "${project.group}:${base.archivesName.get()}:${project.version}:javadoc",
                'Implementation-Title'  : "${base.archivesName.get()}-javadoc",
                'Implementation-Version': project.version
        ])
    }
}

['apiElements', 'runtimeElements'].each { configurationName ->
    configurations.named(configurationName) { artifacts.clear() }
    artifacts { add(configurationName, releaseJar) }
}

tasks.named('assemble') {
    dependsOn releaseJar
    dependsOn tasks.named('sourcesJar')
    dependsOn tasks.named('javadocJar')
}

def expectedReleaseFiles = providers.provider {
    def prefix = "${base.archivesName.get()}-${project.version}"
    ["${prefix}.jar", "${prefix}-sources.jar", "${prefix}-javadoc.jar"]
}
def preparedReleaseDir = providers.gradleProperty('preparedReleaseDir')

tasks.register('verifyReleaseConfiguration') {
    group = 'verification'
    description = 'Validates release identity, target metadata, and dependency policy.'
    doLast {
        if (new JsonSlurper().parse(file('src/main/resources/pack.mcmeta')).pack.pack_format != 7) {
            throw new GradleException('Minecraft 1.17.1 resources must use pack format 7')
        }
        if (project.mod_version != '2.2.10.117011') {
            throw new GradleException("Unexpected baseSteam release version: ${project.mod_version}")
        }
        if (project.minecraft_version != '1.17.1'
                || project.forge_version != '37.1.1'
                || project.mapping_channel != 'official'
                || project.mapping_version != '1.17.1'
                || project.mcp_version != '20210706.113038') {
            throw new GradleException('Unexpected Minecraft, Forge, or mappings target')
        }
        if (project.loader_name != 'forge' || project.loader_code != '1'
                || project.java_version != '16'
                || project.java_toolchain_version != '16.0.2+7'
                || project.gradle_java_version != '17') {
            throw new GradleException('Unexpected release dispatcher target metadata')
        }
        if (project.mod_id != 'basesteam'
                || project.mod_name != 'baseSteam'
                || project.group.toString() != 'zone.moddev.mc.basesteam'
                || base.archivesName.get() != 'baseSteam'
                || project.mod_license != 'GPL-3.0-only'
                || project.curseforge_project_id != '1781373') {
            throw new GradleException('Unexpected Forge, Maven, archive, or CurseForge identity')
        }
        if (project.cf_requirements != 'basepower,base-metals'
                || project.cf_optionals != ''
                || project.cf_versions != '1.17.1') {
            throw new GradleException('Unexpected CurseForge dependency or game-version metadata')
        }
        if (project.basemetals_version != '3.1.1.117011'
                || project.orespawn_version != '4.1.0.117011'
                || project.orespawn_source_commit != 'b56e2b62a1a6ea4d1dd96f8646a87801a817dbdf'
                || project.orespawn_deobf_sha256 != 'CB7A736314842B110B2E4788FBD5E21D4AE8803C5ED34A49199B034BE572DA39') {
            throw new GradleException('Unexpected published-source development API identity')
        }
        if (project.poweradvantage_version != '2.4.9.117011'
                || project.poweradvantage_source_repository != 'MinecraftModDevelopmentMods/basePower') {
            throw new GradleException('Unexpected basePower compile dependency identity')
        }
        String mainSource = file(
                'src/main/java/zone/moddev/mc/basesteam/SteamAdvantage.java').getText('UTF-8')
        if (!mainSource.contains('MODID = "basesteam"')
                || !mainSource.contains('VERSION = "2.2.10.117011"')) {
            throw new GradleException('baseSteam source identity changed')
        }
        String metadata = file('src/main/resources/META-INF/mods.toml').getText('UTF-8').replace('\r\n', '\n')
        ['modId="basesteam"', 'displayName="baseSteam"',
         'modId="basepower"\nmandatory=true\nversionRange="[2.4.9.117011,3.0.0)"',
         'modId="basemetals"\nmandatory=false\nversionRange="[3.1.1.117011,4.0.0)"'].each { marker ->
            if (!metadata.contains(marker)) {
                throw new GradleException("Source mods.toml is missing ${marker}")
            }
        }
    }
}

tasks.register('verifyNativeDevelopmentDependencies') {
    group = 'verification'
    description = 'Resolves Forge and audits the exact development jars.'
    doLast {
        Properties pins = new Properties()
        file('gradle.properties').withInputStream { pins.load(it) }
        ['poweradvantage_source_ref', 'poweradvantage_deobf_sha256',
         'basemetals_source_commit', 'basemetals_deobf_sha256'].each { key ->
            String pinned = pins.getProperty(key, '')
            def pattern = key.endsWith('_sha256') ? /[A-F0-9]{64}/ : /[a-f0-9]{40}/
            if (!(pinned ==~ pattern) || project.property(key) != pinned) {
                throw new GradleException("Supply the exact coordinated ${key} in gradle.properties; overrides are not accepted.")
            }
        }
        String actualHash = MessageDigest.getInstance('SHA-256')
                .digest(powerAdvantageDeobfJar.bytes).encodeHex().toString().toUpperCase()
        if (actualHash != project.poweradvantage_deobf_sha256) {
            throw new GradleException("basePower SHA-256 is ${actualHash}, expected "
                    + project.poweradvantage_deobf_sha256)
        }
        new ZipFile(powerAdvantageDeobfJar).withCloseable { zip ->
            ['cyano/poweradvantage/api/PoweredEntity.class',
             'cyano/poweradvantage/api/GUIBlock.class',
             'cyano/poweradvantage/api/FluidCategoryRegistry.class',
             'cyano/poweradvantage/api/migration/LegacyMigrationApi.class',
             'zone/moddev/mc/basepower/conduitnetwork/ConduitRegistry.class',
             'zone/moddev/mc/basepower/init/Fluids.class',
             'zone/moddev/mc/basepower/init/ItemGroups.class'].each { required ->
                if (zip.getEntry(required) == null) {
                    throw new GradleException("basePower dependency is missing ${required}")
                }
            }
            def manifest = new Manifest(zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF'))).mainAttributes
            if (manifest.getValue('Implementation-Version') != project.poweradvantage_version) {
                throw new GradleException('basePower dependency manifest has the wrong version')
            }
            if (manifest.getValue('Built-On') != '1.17.1-37.1.1'
                    || manifest.getValue('Built-On-Java') != '16') {
                throw new GradleException('basePower must be the native 1.17.1 Java 16 dependency')
            }
        }
        String actualBaseMetalsHash = MessageDigest.getInstance('SHA-256')
                .digest(baseMetalsDeobfJar.bytes).encodeHex().toString().toUpperCase()
        if (actualBaseMetalsHash != project.basemetals_deobf_sha256) {
            throw new GradleException("Base Metals SHA-256 is ${actualBaseMetalsHash}, expected "
                    + project.basemetals_deobf_sha256)
        }
        String actualOreSpawnHash = MessageDigest.getInstance('SHA-256')
                .digest(oreSpawnDeobfJar.bytes).encodeHex().toString().toUpperCase()
        if (actualOreSpawnHash != project.orespawn_deobf_sha256) {
            throw new GradleException("OreSpawn SHA-256 is ${actualOreSpawnHash}, expected "
                    + project.orespawn_deobf_sha256)
        }

        Set<File> compileFiles = configurations.compileClasspath.files.collect { it.canonicalFile } as Set<File>
        if (!compileFiles.contains(powerAdvantageDeobfJar.canonicalFile)) {
            throw new GradleException('basePower is missing from compileClasspath')
        }
        Set<File> runtimeFiles = configurations.runtimeClasspath.files.collect { it.canonicalFile } as Set<File>
        if (!runtimeFiles.contains(powerAdvantageDeobfJar.canonicalFile)) {
            throw new GradleException('basePower is missing from runtimeClasspath')
        }
        if (!runtimeFiles.contains(baseMetalsDeobfJar.canonicalFile)) {
            throw new GradleException('Base Metals is missing from runtimeClasspath')
        }
        if (!runtimeFiles.contains(oreSpawnDeobfJar.canonicalFile)) {
            throw new GradleException('OreSpawn is missing from runtimeClasspath')
        }
        List<String> forbiddenRuntimeMods = runtimeFiles.collect { it.name.toLowerCase(Locale.ROOT) }
                .findAll { name ->
                    name.contains('rf-api') || name.contains('reborncore')
                }
        if (!forbiddenRuntimeMods.isEmpty()) {
            throw new GradleException(
                    "An optional provider mod leaked onto runtimeClasspath: ${forbiddenRuntimeMods}")
        }
    }
}

tasks.register('verifyReleaseDependencies') {
    group = 'verification'
    description = 'Audits native development dependencies with the final release source pin.'
    dependsOn tasks.named('verifyReleaseConfiguration')
    dependsOn tasks.named('verifyNativeDevelopmentDependencies')
}

tasks.register('verifyReleaseArtifacts') {
    group = 'verification'
    description = 'Audits the exact three distributable jars and release-critical contents.'
    dependsOn tasks.named('verifyReleaseDependencies')
    dependsOn tasks.named('assemble')
    doLast {
        File libs = layout.buildDirectory.dir('libs').get().asFile
        List<File> jars = (libs.listFiles() ?: [] as File[])
                .findAll { it.name.endsWith('.jar') }.sort { it.name }
        List<String> expected = expectedReleaseFiles.get().sort()
        if (jars.collect { it.name } != expected) {
            throw new GradleException("Expected exactly ${expected}, found ${jars.collect { it.name }}")
        }
        jars.each { candidate ->
            if (candidate.length() == 0L) {
                throw new GradleException("Empty release artifact: ${candidate.name}")
            }
            new ZipFile(candidate).withCloseable { candidateZip ->
                candidateZip.entries().findAll { entry ->
                    !entry.isDirectory()
                            && (archiveTextSuffixes.any { entry.name.endsWith(it) }
                            || entry.name.endsWith('/element-list')
                            || entry.name.endsWith('/package-list'))
                }.each { entry ->
                    boolean containsCarriageReturn = candidateZip.getInputStream(entry).withCloseable { input ->
                        input.bytes.any { value -> value == 13 }
                    }
                    if (containsCarriageReturn) {
                        throw new GradleException(
                                "${candidate.name}!/${entry.name} does not use canonical LF line endings")
                    }
                }
            }
        }

        File mainJar = new File(libs, expectedReleaseFiles.get()[0])
        new ZipFile(mainJar).withCloseable { zip ->
            List<String> names = zip.entries().collect { it.name }
            ['META-INF/mods.toml', 'pack.mcmeta',
             'zone/moddev/mc/basesteam/SteamAdvantage.class',
             'zone/moddev/mc/basesteam/machines/SteamDrillTileEntity.class',
             'zone/moddev/mc/basesteam/machines/SteamPumpTileEntity.class',
             'zone/moddev/mc/basesteam/machines/GeothermalBoilerTileEntity.class',
             'zone/moddev/mc/basesteam/migration/SteamLegacyMigrations.class',
             'assets/basesteam/lang/en_us.json',
             'data/basesteam/recipes/steam_pipe.json',
             'data/basesteam/advancements/recipes/steam_pipe.json'].each { required ->
                if (!names.contains(required)) {
                    throw new GradleException("Release jar is missing ${required}")
                }
            }
            ['steam_pipe', 'steam_track', 'steam_boiler_coal', 'steam_boiler_electric',
             'steam_boiler_geothermal', 'steam_tank', 'steam_furnace', 'steam_crusher',
             'steam_drill', 'steam_elevator', 'steam_switch', 'steam_still', 'steam_pump',
             'steam_boiler_oil'].each { id ->
                if (!names.contains("data/basesteam/loot_tables/blocks/${id}.json".toString())) {
                    throw new GradleException("Release jar is missing native block loot for ${id}")
                }
            }
            def resourcePack = new JsonSlurper().parseText(zip.getInputStream(zip.getEntry('pack.mcmeta'))
                    .getText(StandardCharsets.UTF_8.name()))
            if (resourcePack.pack.pack_format != 7) {
                throw new GradleException('Packaged resources must use native 1.17 pack format 7')
            }
            ['agent-notes/', '.codex/', 'src/test/', 'fernflower_abstract_parameter_names.txt',
              'cyano/poweradvantage/', 'zone/moddev/mc/basepower/', 'zone/moddev/mc/poweradvantage/',
              'zone/moddev/mc/steamadvantage/', 'assets/steamadvantage/', 'data/steamadvantage/',
              'zone/moddev/mc/basemetals/', 'cyano/basemetals/', 'com/mcmoddev/lib/',
              'cyano/orespawn/', 'com/mcmoddev/orespawn/', 'cofh/api/', 'reborncore/',
             'net/minecraft/', 'net/minecraftforge/'].each { forbidden ->
                if (names.any { it.contains(forbidden) }) {
                    throw new GradleException("Release jar contains forbidden entry matching ${forbidden}")
                }
            }
            String metadata = zip.getInputStream(zip.getEntry('META-INF/mods.toml'))
                    .getText(StandardCharsets.UTF_8.name())
            if (!metadata.contains('modId="basesteam"')
                    || !metadata.contains("version=\"${project.mod_version}\"")) {
                throw new GradleException('Packaged mods.toml identity or version is incorrect')
            }
            def manifest = new Manifest(zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF'))).mainAttributes
            if (manifest.getValue('Implementation-Version') != project.mod_version
                    || manifest.getValue('Built-On-Java') != project.java_version
                    || manifest.getValue('Implementation-Timestamp') != null
                    || manifest.getValue('Timestamp') != null) {
                throw new GradleException('Release manifest identity is incorrect or volatile')
            }
            zip.entries().findAll { it.name.endsWith('.class') }.each { entry ->
                byte[] header = new byte[8]
                zip.getInputStream(entry).withCloseable { input ->
                    if (input.read(header) != header.length) {
                        throw new GradleException("Cannot inspect bytecode header for ${entry.name}")
                    }
                }
                int major = ((header[6] & 0xff) << 8) | (header[7] & 0xff)
                if (major != 60) {
                    throw new GradleException("${entry.name} uses Java class major ${major}, expected 60")
                }
            }
        }

        new ZipFile(new File(libs, expectedReleaseFiles.get()[1])).withCloseable { sourceZip ->
            if (sourceZip.getEntry('zone/moddev/mc/basesteam/SteamAdvantage.java') == null
                    || sourceZip.getEntry('zone/moddev/mc/basesteam/machines/SteamDrillTileEntity.java') == null) {
                throw new GradleException('Sources jar is missing required baseSteam sources')
            }
        }
        new ZipFile(new File(libs, expectedReleaseFiles.get()[2])).withCloseable { javadocZip ->
            if (javadocZip.getEntry('index.html') == null) {
                throw new GradleException('Javadoc jar is missing index.html')
            }
        }
    }
}

tasks.register('writeReleaseChecksums') {
    group = 'verification'
    description = 'Writes SHA-256 checksums for the audited release jars.'
    dependsOn tasks.named('verifyReleaseArtifacts')
    def outputFile = layout.buildDirectory.file('release/SHA256SUMS')
    inputs.files(provider { expectedReleaseFiles.get().collect { layout.buildDirectory.file("libs/${it}").get().asFile } })
    outputs.file(outputFile)
    inputs.files(expectedReleaseFiles.map { names -> names.collect { layout.buildDirectory.file("libs/${it}").get().asFile } })
    doLast {
        File output = outputFile.get().asFile
        output.parentFile.mkdirs()
        File libs = layout.buildDirectory.dir('libs').get().asFile
        String contents = expectedReleaseFiles.get().sort().collect { name ->
            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            new File(libs, name).withInputStream { input ->
                byte[] buffer = new byte[8192]
                for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
                    if (read > 0) digest.update(buffer, 0, read)
                }
            }
            "${digest.digest().encodeHex().toString().toUpperCase()}  ${name}"
        }.join('\n') + '\n'
        output.setText(contents, 'UTF-8')
    }
}

tasks.register('verifyPreparedReleaseArtifacts') {
    group = 'verification'
    description = 'Audits an immutable release bundle before Maven publication.'
    doLast {
        if (!preparedReleaseDir.isPresent()) {
            throw new GradleException('preparedReleaseDir is required for prepared artifact publication')
        }
        File prepared = file(preparedReleaseDir.get())
        List<String> expected = expectedReleaseFiles.get().sort()
        List<File> jars = (prepared.listFiles() ?: [] as File[])
                .findAll { it.name.endsWith('.jar') }.sort { it.name }
        if (!prepared.isDirectory() || jars.collect { it.name } != expected
                || jars.any { it.length() == 0L }) {
            throw new GradleException("Prepared release must contain exactly the non-empty jars ${expected}")
        }
        File checksums = new File(prepared, 'SHA256SUMS')
        File changelog = new File(prepared, 'CHANGELOG.txt')
        if (!checksums.isFile() || !changelog.isFile()) {
            throw new GradleException('Prepared release is missing SHA256SUMS or CHANGELOG.txt')
        }
        List<String> actualChecksums = jars.collect { candidate ->
            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            candidate.withInputStream { input ->
                byte[] buffer = new byte[8192]
                for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
                    if (read > 0) digest.update(buffer, 0, read)
                }
            }
            "${digest.digest().encodeHex().toString().toUpperCase()}  ${candidate.name}"
        }.sort()
        List<String> declaredChecksums = checksums.readLines('UTF-8')
                .findAll { !it.trim().isEmpty() }.sort()
        if (actualChecksums != declaredChecksums) {
            throw new GradleException('Prepared release checksums do not match the immutable jars')
        }
    }
}

