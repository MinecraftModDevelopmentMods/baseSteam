import groovy.json.JsonSlurper
import java.nio.charset.StandardCharsets
import java.security.MessageDigest
import java.util.jar.Manifest
import java.util.zip.ZipFile
import org.apache.tools.ant.filters.FixCrLfFilter

plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '7.0.34'
}

apply from: 'gradle/forge64-mavenizer.gradle'

group = project.mod_group
version = project.mod_version
base.archivesName = 'baseSteam'

def versionParts = project.mod_version.toString().tokenize('.')
if (versionParts.size() != 4 || !versionParts.every { it ==~ /\d+/ }) {
    throw new GradleException("mod_version must use Major.Minor.Bug.Target numeric form: ${project.mod_version}")
}
def minecraftVersionParts = project.minecraft_version.toString().tokenize('.')
if (minecraftVersionParts.size() < 2 || minecraftVersionParts.size() > 3
        || !minecraftVersionParts.every { it ==~ /\d+/ }) {
    throw new GradleException("minecraft_version must use major.minor or major.minor.patch numeric form: "
            + project.minecraft_version)
}
def minecraftPatch = minecraftVersionParts.size() == 3 ? minecraftVersionParts[2] : '0'
def expectedTargetVersion = "${minecraftVersionParts[0]}" \
        + "${minecraftVersionParts[1].padLeft(2, '0')}" \
        + "${minecraftPatch.padLeft(2, '0')}" \
        + project.loader_code
if (versionParts[3] != expectedTargetVersion) {
    throw new GradleException("mod_version target ${versionParts[3]} does not match "
            + "Minecraft ${project.minecraft_version} ${project.loader_name} target ${expectedTargetVersion}")
}

ext.functional_version = versionParts[0..2].join('.')
ext.display_version = project.mod_version
ext.release_tag = project.mod_version

if (GradleVersion.current() != GradleVersion.version('9.6.1')
        || JavaVersion.current() != JavaVersion.VERSION_25) {
    throw new GradleException('Use Gradle 9.6.1 running on the pinned Java 25 toolchain')
}

fgtools.configure('slimelauncher') {
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.ADOPTIUM
    })
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.ADOPTIUM
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.ADOPTIUM
    }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '1000'])
}

tasks.withType(Javadoc).configureEach {
    failOnError = false
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addBooleanOption('notimestamp', true)
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    includeEmptyDirs = false
}

def archiveTextSuffixes = [
        '.cfg', '.css', '.html', '.info', '.java', '.js', '.json', '.lang',
        '.mcmeta', '.md', '.properties', '.toml', '.txt', '.xml'
]
def archiveTextPatterns = archiveTextSuffixes.collect { "**/*${it}".toString() }
archiveTextPatterns.addAll(['**/element-list', '**/package-list'])
def normalizeArchiveLineEndings = { details ->
    details.filter(FixCrLfFilter,
            eol: FixCrLfFilter.CrLf.newInstance('lf'),
            eof: FixCrLfFilter.AddAsisRemove.newInstance('asis'))
}

sourceSets {
    gameTestValidation {
        java.srcDir 'src/gametest/java'
        resources.srcDir 'src/gametest/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    gameTestValidationImplementation.extendsFrom implementation
    gameTestValidationCompileOnly.extendsFrom compileOnly
    gameTestValidationRuntimeOnly.extendsFrom runtimeOnly
}

def steamGameTestRunDirectory = layout.buildDirectory.dir(
        providers.gradleProperty('steamGameTestRunId').orElse('run').map { runId ->
            if (!(runId ==~ /[A-Za-z0-9_-]+/)) throw new GradleException('Invalid Steam GameTest run ID')
            "steam-gametest-${runId}"
        })

minecraft {
    if (gradle.startParameter.offline) {
        mavenizerArguments.add('--offline')
        mavenizerArguments.add('--cache-only')
    }
    mappings channel: project.mapping_channel, version: project.mapping_version
    String configuredRunDirectory = providers.gradleProperty('steamAdvantageRunDirectory')
            .getOrElse('run')
    runs {
        configureEach {
            jvmArgs '--add-opens', 'java.base/java.lang.invoke=ALL-UNNAMED',
                    '-XX:ActiveProcessorCount=4', '-Xmx1536m'
            workingDir.convention layout.projectDirectory.dir(configuredRunDirectory)
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'info'
            mods { basesteam { source sourceSets.main } }
        }
        register('client')
        register('server') {
            args '--nogui'
        }
        register('gameTestServer') {
            workingDir.set(steamGameTestRunDirectory)
            systemProperty 'forge.enableGameTest', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            args '--tests', "${mod_id}:*", '--report', 'steam-gametest-results.xml'
            mods { basesteam { source sourceSets.gameTestValidation } }
        }
        register('data') {
            workingDir.convention layout.projectDirectory.dir('run-data')
            args '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/**'
}

def forgeRunModClassesDirectory = layout.buildDirectory.dir('forge-run-mod-classes/main')
def prepareForgeRunModClasses = tasks.register('prepareForgeRunModClasses', Sync) {
    group = 'ide'
    description = 'Merges classes and processed resources for Forge 66 launches.'
    dependsOn tasks.named('classes')
    from sourceSets.main.output
    into forgeRunModClassesDirectory
}
def gameTestModClassesDirectory = layout.buildDirectory.dir('forge-run-mod-classes/gametest')
def prepareForgeGameTestModClasses = tasks.register('prepareForgeGameTestModClasses', Sync) {
    dependsOn tasks.named('classes'), tasks.named('gameTestValidationClasses')
    from sourceSets.main.output, sourceSets.gameTestValidation.output
    into gameTestModClassesDirectory
}
tasks.withType(JavaExec).configureEach {
    jvmArgs '-XX:ActiveProcessorCount=4'
    maxHeapSize = '1536m'
    doFirst {
        ['JAVA_TOOL_OPTIONS', 'JDK_JAVA_OPTIONS', '_JAVA_OPTIONS'].each { name ->
            if (environment.containsKey(name)) throw new GradleException("${path} must not inherit ${name}")
        }
        logger.lifecycle("${path}: inherited JVM option variables absent; explicit -XX:ActiveProcessorCount=4 -Xmx1536m")
    }
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.ADOPTIUM
    }
    if (name in ['runClient', 'runServer', 'runData', 'runGameTestServer']) {
        boolean gameTest = name == 'runGameTestServer'
        def mergedOutput = gameTest ? gameTestModClassesDirectory : forgeRunModClassesDirectory
        dependsOn gameTest ? prepareForgeGameTestModClasses : prepareForgeRunModClasses
        environment 'MOD_CLASSES', "${mod_id}%%${mergedOutput.get().asFile.absolutePath}"
        doFirst {
            File runDirectory = gameTest ? steamGameTestRunDirectory.get().asFile : workingDir
            if (gameTest) {
                if (new File(runDirectory, 'logs/latest.log').exists()) {
                    throw new GradleException("Choose a fresh -PsteamGameTestRunId to preserve ${runDirectory}")
                }
                workingDir(runDirectory)
            }
            if (name == 'runClient') setArgs(['--launcher-side', 'client'] + args)
            Set<File> splitOutputs = [sourceSets.main, sourceSets.gameTestValidation].collectMany {
                it.output.files
            }.collect { it.canonicalFile } as Set<File>
            classpath = files(mergedOutput.get().asFile, classpath.files.findAll {
                !splitOutputs.contains(it.canonicalFile)
            })
            new File(runDirectory, 'mods').mkdirs()
            if (gameTest) {
                File settings = new File(runDirectory, 'server.properties')
                if (!settings.exists()) {
                    java.nio.file.Files.copy(file('ci-fixtures/steam-gametest-server.properties').toPath(),
                            settings.toPath())
                }
            }
        }
        if (gameTest) doLast {
            // Forge can exit zero after a loader failure; require the actual test result.
            File receipt = new File(steamGameTestRunDirectory.get().asFile, 'logs/latest.log')
            String output = receipt.isFile() ? receipt.getText('UTF-8') : ''
            if (!output.contains('All 4 required tests passed') || (output =~ /\[[^\]\r\n]*\/(?:ERROR|FATAL)\]/).find()) {
                throw new GradleException("The four Steam GameTests did not pass; see ${receipt}")
            }
            if (!output.contains('BASESTEAM_NATIVE_TRADES_PASS definitions=5 placements=10 samples=1280 codecNegatives=8 providerWitnesses=1 legacyPluralWitnesses=1')) {
                throw new GradleException("Missing native villager trade codec and offer witness: ${receipt}")
            }
            if (!output.contains('BASESTEAM_NATIVE_JVM_PASS inheritedOptions=absent processorCap=4 heapCapMiB=1536')) {
                throw new GradleException("Missing actual native JVM environment and cap witness: ${receipt}")
            }
            def salvage = output =~ /BASESTEAM_NATIVE_SALVAGE_PASS mode=(NORMAL|TECH_PROGRESSION|APOCALYPTIC) present=(\d+) absent=(\d+) nativeCodecs=(\d+) inputNegatives=(\d+)/
            if (!salvage.find()) throw new GradleException("Missing native salvage recipe witness: ${receipt}")
            List<String> expectedSalvage = salvage.group(1) == 'APOCALYPTIC' ? ['9', '0', '9', '9'] : ['0', '9', '0', '0']
            if ((2..5).collect { salvage.group(it) } != expectedSalvage || salvage.find()) {
                throw new GradleException("Incorrect native salvage recipe witness: ${receipt}")
            }
            File report = new File(steamGameTestRunDirectory.get().asFile, 'steam-gametest-results.xml')
            if (!report.isFile()) throw new GradleException('Missing native GameTest XML report')
            def results = new groovy.xml.XmlSlurper().parse(report)
            def cases = results.depthFirst().findAll { it.name() == 'testcase' }
            Set<String> expectedTests = [
                    'drill_bit_packet_preserves_type_position_and_direction',
                    'legacy_musket_wear_and_loaded_byte_survive_native_componentization',
                    'older_musket_alias_and_top_level_wear_survive_power_migration',
                    'native_resources_load_with_expected_ids'
            ].collect { "${mod_id}:${it}".toString() } as Set<String>
            if (cases.size() != 4 || (cases.collect { it.@name.text() } as Set<String>) != expectedTests
                    || cases.any { it.failure.size() || it.error.size() || it.skipped.size() }) {
                throw new GradleException("Expected exactly four successful Steam GameTests without skips: ${report}")
            }
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    mavenCentral()
    maven {
        name = 'MinecraftLibraries'
        url = 'https://libraries.minecraft.net/'
    }
}

// Only code and launch tasks require the exact jars; source/resource checks can run independently.
def explicitJar = { String property -> providers.gradleProperty(property).map { file(it) }.getOrNull() }
def powerRoot = '../../PowerAdvantage'
def baseMetalsRoot = '../../../../BaseMetals/BaseMetals 263/BaseMetals'
def powerNativeJar = file("${powerRoot}/build/libs/basePower-${project.poweradvantage_version}.jar")
def powerAdvantageDeobfJar = explicitJar('powerAdvantageDeobfJar') ?: powerNativeJar
def baseMetalsDeobfJar = explicitJar('baseMetalsDeobfJar') ?: file(
        "${baseMetalsRoot}/build/libs/BaseMetals-${project.basemetals_version}.jar")
def oreSpawnRoot = '../../../../MinecraftMineralogy/OS263/OreSpawn'
def oreSpawnJar = { String variant ->
    explicitJar("oreSpawn${variant}Jar") ?: file(
            "${oreSpawnRoot}/build/libs/OreSpawn-${project.orespawn_version}.jar")
}
def oreSpawnDeobfJar = oreSpawnJar('Deobf')
def developmentJars = files(powerAdvantageDeobfJar, baseMetalsDeobfJar, oreSpawnDeobfJar)

dependencies {
    implementation minecraft.dependency(
            "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")
    // basePower is required at runtime but remains a separate mod jar.
    compileOnly developmentJars
