            .collect { "basesteam:${it}".toString() } as Set
]
def verifyOwnedAtlas = { String path, Object atlas, String owner, Set<String> registered, Closure exists ->
    if (!(atlas instanceof Map) || atlas.keySet() != ['sources'] as Set
            || !(atlas.sources instanceof List) || atlas.sources.isEmpty()) {
        throw new GradleException("${owner} ${path} requires nonempty explicit native sprite sources")
    }
    Set<String> sprites = [] as Set
    atlas.sources.each { source ->
        if (!(source instanceof Map) || source.keySet() != ['type', 'resource'] as Set
                || source.type != 'minecraft:single' || !(source.resource instanceof String)
                || !(source.resource ==~ /${owner}:[a-z0-9_\/-]+/)
                || source.resource.contains('..')) {
            throw new GradleException("${owner} ${path} must contain only owned, unaliased native single sprites")
        }
        String sprite = source.resource
        if (!registered.add(sprite)) throw new GradleException("Duplicate sprite across native atlases: ${sprite}")
        String spritePath = sprite.substring(sprite.indexOf(':') + 1)
        if (path == itemsAtlasPath && !spritePath.startsWith('items/')) {
            throw new GradleException("${owner} item atlas must not register block/material sprites: ${sprite}")
        }
        if (!exists("assets/${owner}/textures/${spritePath}.png".toString())) {
            throw new GradleException("${owner} ${path} registers missing sprite ${sprite}")
        }
        sprites.add(sprite)
    }
    sprites
}
def verifySteamAtlas = { String path, Object atlas ->
    Set<String> actual = verifyOwnedAtlas(path, atlas, 'basesteam', [] as Set) { String resource ->
        file("src/main/resources/${resource}").isFile()
    }
    if (!steamAtlasPaths.contains(path) || actual != steamAtlasResources[path]) {
        throw new GradleException("Steam ${path} must retain its exact owned native sprite inventory")
    }
}
def verifyPackagedAssetNamespaces = { ZipFile zip ->
    String steamAssets = "assets/${project.mod_id}/"
    def foreignAssets = zip.entries().findAll {
        !it.directory && it.name.startsWith('assets/') && !it.name.startsWith(steamAssets)
    }.collect { it.name }
    if (foreignAssets.sort() != steamAtlasPaths.sort(false)) {
        throw new GradleException("${zip.name} must contain only ${steamAtlasPaths} outside ${steamAssets}; found ${foreignAssets}")
    }
    Set<String> registered = [] as Set
    steamAtlasPaths.each { path ->
        zip.getInputStream(zip.getEntry(path)).withCloseable { input ->
            def atlas = new JsonSlurper().parse(input, 'UTF-8')
            verifySteamAtlas(path, atlas)
            verifyOwnedAtlas(path, atlas, 'basesteam', registered) { String resource ->
                zip.getEntry(resource) != null
            }
        }
    }
}

tasks.register('verifyReleaseArtifacts') {
    group = 'verification'
    description = 'Audits the exact three distributable jars and release-critical contents.'
    dependsOn tasks.named('verifyReleaseDependencies')
    dependsOn tasks.named('assemble')
    dependsOn tasks.named('jar')
    doLast {
        File libs = layout.buildDirectory.dir('libs').get().asFile
        List<File> jars = (libs.listFiles() ?: [] as File[])
                .findAll { it.name.endsWith('.jar') }.sort { it.name }
        List<String> expected = expectedReleaseFiles.get().sort()
        if (jars.collect { it.name } != expected) {
            throw new GradleException("Expected exactly ${expected}, found ${jars.collect { it.name }}")
        }
        jars.each { candidate ->
            if (candidate.length() == 0L) {
                throw new GradleException("Empty release artifact: ${candidate.name}")
            }
            new ZipFile(candidate).withCloseable { candidateZip ->
                candidateZip.entries().findAll { entry ->
                    !entry.isDirectory()
                            && (archiveTextSuffixes.any { entry.name.endsWith(it) }
                            || entry.name.endsWith('/element-list')
                            || entry.name.endsWith('/package-list'))
                }.each { entry ->
                    boolean containsCarriageReturn = candidateZip.getInputStream(entry).withCloseable { input ->
                        input.bytes.any { value -> value == 13 }
                    }
                    if (containsCarriageReturn) {
                        throw new GradleException(
                                "${candidate.name}!/${entry.name} does not use canonical LF line endings")
                    }
                }
            }
        }

        File mainJar = new File(libs, expectedReleaseFiles.get()[0])
        new ZipFile(mainJar).withCloseable { zip ->
            verifyPackagedAssetNamespaces(zip)
            List<String> names = zip.entries().collect { it.name }
            ['META-INF/mods.toml', 'pack.mcmeta',
             'zone/moddev/mc/basesteam/SteamAdvantage.class',
             'zone/moddev/mc/basesteam/machines/SteamDrillTileEntity.class',
             'zone/moddev/mc/basesteam/machines/SteamPumpTileEntity.class',
             'zone/moddev/mc/basesteam/machines/GeothermalBoilerTileEntity.class',
             'zone/moddev/mc/basesteam/migration/SteamLegacyMigrations.class',
             'data/basesteam/loot_table/chests/advantage_parts.json',
             'assets/basesteam/lang/en_us.json',
             'data/basesteam/damage_type/musket.json',
             'data/basesteam/damage_type/steam_machine.json',
             'data/basesteam/recipe/steam_pipe.json',
             'data/basesteam/enchantment/high_explosive.json',
             'data/basesteam/enchantment/powderless.json',
             'data/basesteam/enchantment/rapid_reload.json',
             'data/basesteam/enchantment/recoil.json',
             'data/basesteam/tags/item/muskets.json',
             'data/minecraft/tags/enchantment/non_treasure.json',
             'data/minecraft/tags/enchantment/tooltip_order.json',
             'data/basesteam/advancement/recipes/steam_pipe.json'].each { required ->
                if (!names.contains(required)) {
                    throw new GradleException("Release jar is missing ${required}")
                }
            }
            ['steam_pipe', 'steam_track', 'steam_boiler_coal', 'steam_boiler_electric',
             'steam_boiler_geothermal', 'steam_tank', 'steam_furnace', 'steam_crusher',
             'steam_drill', 'drillbit', 'platform', 'steam_elevator', 'steam_switch',
             'pump_pipe_steam', 'steam_still', 'steam_pump', 'steam_boiler_oil',
             'steam_governor', 'steam_drill_bit', 'blackpowder_cartridge', 'musket'].each { id ->
                if (!names.contains("assets/basesteam/items/${id}.json".toString())) {
                    throw new GradleException("Release jar is missing native item definition ${id}")
                }
            }
            ['steam_pipe', 'steam_track', 'steam_boiler_coal', 'steam_boiler_electric',
             'steam_boiler_geothermal', 'steam_tank', 'steam_furnace', 'steam_crusher',
             'steam_drill', 'steam_elevator', 'steam_switch', 'steam_still', 'steam_pump',
             'steam_boiler_oil'].each { id ->
                if (!names.contains("data/basesteam/loot_table/blocks/${id}.json".toString())) {
                    throw new GradleException("Release jar is missing native block loot for ${id}")
                }
            }
            def resourcePack = new JsonSlurper().parseText(zip.getInputStream(zip.getEntry('pack.mcmeta'))
                    .getText(StandardCharsets.UTF_8.name()))
            verifyPackFormats(resourcePack.pack)
            ['agent-notes/', '.codex/', 'src/test/', 'zone/moddev/mc/basesteam/testing/',
             'zone/moddev/mc/basesteam/gametest/', 'data/basesteam/structure/basesteam_empty.nbt',
             'fernflower_abstract_parameter_names.txt',
              'cyano/poweradvantage/', 'zone/moddev/mc/basepower/', 'zone/moddev/mc/poweradvantage/',
              'zone/moddev/mc/steamadvantage/', 'assets/steamadvantage/', 'data/steamadvantage/',
              'zone/moddev/mc/basemetals/', 'cyano/basemetals/', 'com/mcmoddev/lib/',
              'cyano/orespawn/', 'com/mcmoddev/orespawn/', 'cofh/api/', 'reborncore/',
             'net/minecraft/', 'net/minecraftforge/'].each { forbidden ->
                if (names.any { it.contains(forbidden) }) {
                    throw new GradleException("Release jar contains forbidden entry matching ${forbidden}")
                }
            }
            if (names.any { it ==~ /data\/[^\/]+\/(?:recipes|advancements|loot_tables|structures)\/.*/
                    || it ==~ /data\/[^\/]+\/tags\/(?:items|blocks)\/.*/ }) {
                throw new GradleException('Release jar contains pre-1.21 datapack registry directories')
            }
            String metadata = zip.getInputStream(zip.getEntry('META-INF/mods.toml'))
                    .getText(StandardCharsets.UTF_8.name())
            verifyRequiredBaseMetalsMetadata(metadata)
            if (!metadata.contains('modId="basesteam"')
                    || !metadata.contains('showAsResourcePack=false')
                    || !metadata.contains("version=\"${project.mod_version}\"")
                    || !metadata.contains("versionRange=\"${project.minecraft_version_range}\"")
                    || !metadata.contains("versionRange=\"${project.forge_version_range}\"")
                    || !metadata.contains("loaderVersion=\"${project.loader_version_range}\"")) {
                throw new GradleException('Packaged mods.toml identity or version is incorrect')
            }
            def manifest = new Manifest(zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF'))).mainAttributes
            if (manifest.getValue('Implementation-Version') != project.mod_version
                    || manifest.getValue('Built-On-Java') != project.java_version
                    || manifest.getValue('Built-On') != "${project.minecraft_version}-${project.forge_version}"
                    || manifest.getValue('Implementation-Timestamp') != null
                    || manifest.getValue('Timestamp') != null) {
                throw new GradleException('Release manifest identity is incorrect or volatile')
            }
            zip.entries().findAll { it.name.endsWith('.class') }.each { entry ->
                byte[] header = new byte[8]
                zip.getInputStream(entry).withCloseable { input ->
                    if (input.read(header) != header.length) {
                        throw new GradleException("Cannot inspect bytecode header for ${entry.name}")
                    }
                }
                int major = ((header[6] & 0xff) << 8) | (header[7] & 0xff)
                if (major != 69) {
                    throw new GradleException("${entry.name} uses Java class major ${major}, expected 69")
                }
            }
        }

        new ZipFile(tasks.named('jar', Jar).get().archiveFile.get().asFile).withCloseable { zip ->
            verifyPackagedAssetNamespaces(zip)
        }
        new ZipFile(new File(libs, expectedReleaseFiles.get()[1])).withCloseable { sourceZip ->
            if (sourceZip.getEntry('zone/moddev/mc/basesteam/SteamAdvantage.java') == null
                    || sourceZip.getEntry('zone/moddev/mc/basesteam/machines/SteamDrillTileEntity.java') == null) {
                throw new GradleException('Sources jar is missing required baseSteam sources')
            }
        }
        new ZipFile(new File(libs, expectedReleaseFiles.get()[2])).withCloseable { javadocZip ->
            if (javadocZip.getEntry('index.html') == null) {
                throw new GradleException('Javadoc jar is missing index.html')
            }
        }
    }
}

tasks.register('writeReleaseChecksums') {
    group = 'verification'
    description = 'Writes SHA-256 checksums for the audited release jars.'
    dependsOn tasks.named('verifyReleaseArtifacts')
    def outputFile = layout.buildDirectory.file('release/SHA256SUMS')
    inputs.files(provider { expectedReleaseFiles.get().collect { layout.buildDirectory.file("libs/${it}").get().asFile } })
    outputs.file(outputFile)
    inputs.files(expectedReleaseFiles.map { names -> names.collect { layout.buildDirectory.file("libs/${it}").get().asFile } })
    doLast {
        File output = outputFile.get().asFile
        output.parentFile.mkdirs()
        File libs = layout.buildDirectory.dir('libs').get().asFile
        String contents = expectedReleaseFiles.get().sort().collect { name ->
            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            new File(libs, name).withInputStream { input ->
                byte[] buffer = new byte[8192]
                for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
                    if (read > 0) digest.update(buffer, 0, read)
                }
            }
            "${digest.digest().encodeHex().toString().toUpperCase()}  ${name}"
        }.join('\n') + '\n'
        output.setText(contents, 'UTF-8')
    }
}

tasks.register('verifyPreparedReleaseArtifacts') {
    group = 'verification'
    description = 'Audits an immutable release bundle before Maven publication.'
    doLast {
        if (!preparedReleaseDir.isPresent()) {
            throw new GradleException('preparedReleaseDir is required for prepared artifact publication')
        }
        File prepared = file(preparedReleaseDir.get())
        List<String> expected = expectedReleaseFiles.get().sort()
        List<File> jars = (prepared.listFiles() ?: [] as File[])
                .findAll { it.name.endsWith('.jar') }.sort { it.name }
        if (!prepared.isDirectory() || jars.collect { it.name } != expected
                || jars.any { it.length() == 0L }) {
            throw new GradleException("Prepared release must contain exactly the non-empty jars ${expected}")
        }
        File checksums = new File(prepared, 'SHA256SUMS')
        File changelog = new File(prepared, 'CHANGELOG.txt')
        if (!checksums.isFile() || !changelog.isFile()) {
            throw new GradleException('Prepared release is missing SHA256SUMS or CHANGELOG.txt')
        }
        List<String> actualChecksums = jars.collect { candidate ->
            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            candidate.withInputStream { input ->
                byte[] buffer = new byte[8192]
                for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
                    if (read > 0) digest.update(buffer, 0, read)
                }
            }
            "${digest.digest().encodeHex().toString().toUpperCase()}  ${candidate.name}"
        }.sort()
        List<String> declaredChecksums = checksums.readLines('UTF-8')
                .findAll { !it.trim().isEmpty() }.sort()
        if (actualChecksums != declaredChecksums) {
            throw new GradleException('Prepared release checksums do not match the immutable jars')
        }
        new ZipFile(new File(prepared, expectedReleaseFiles.get()[0])).withCloseable { zip ->
            verifyPackagedAssetNamespaces(zip)
        }
    }
}

