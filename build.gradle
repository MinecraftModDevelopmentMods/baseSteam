tasks.register('verifyNativeDevelopmentDependencies') {
    group = 'verification'
    description = 'Resolves Forge and audits the exact development JARs.'
    dependsOn tasks.named('verifyCompanionDevelopmentDependencies')
    doLast {
        committedPin('poweradvantage_version', /\d+\.\d+\.\d+\.2603001/)
        committedPin('poweradvantage_source_ref', /[a-f0-9]{40}/)
        auditJar(powerAdvantageDeobfJar, 'powerAdvantageDeobfJar', 'poweradvantage_deobf_sha256',
                'basepower', project.poweradvantage_version, powerApi)

        Set<File> compileFiles = configurations.compileClasspath.files.collect { it.canonicalFile } as Set<File>
        if (!compileFiles.contains(powerAdvantageDeobfJar.canonicalFile)) {
            throw new GradleException('basePower is missing from compileClasspath')
        }
        Set<File> runtimeFiles = configurations.runtimeClasspath.files.collect { it.canonicalFile } as Set<File>
        if (!runtimeFiles.contains(powerAdvantageDeobfJar.canonicalFile)) {
            throw new GradleException('basePower is missing from runtimeClasspath')
        }
        if (!runtimeFiles.contains(baseMetalsDeobfJar.canonicalFile)) {
            throw new GradleException('Base Metals is missing from runtimeClasspath')
        }
        if (!runtimeFiles.contains(oreSpawnDeobfJar.canonicalFile)) {
            throw new GradleException('OreSpawn is missing from runtimeClasspath')
        }
        List<String> forbiddenRuntimeMods = runtimeFiles.collect { it.name.toLowerCase(Locale.ROOT) }
                .findAll { name ->
                    name.contains('rf-api') || name.contains('reborncore')
                }
        if (!forbiddenRuntimeMods.isEmpty()) {
            throw new GradleException(
                    "An optional provider mod leaked onto runtimeClasspath: ${forbiddenRuntimeMods}")
        }
    }
}

