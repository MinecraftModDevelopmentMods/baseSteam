def oreSpawnRoot = '../../../../MinecraftMineralogy/OS1201/OreSpawn'
def oreSpawnJar = { String variant ->
    String directory = variant == 'Deobf' ? 'libs-dev' : 'libs'
    String classifier = variant == 'Deobf' ? '-deobf' : ''
    explicitJar("oreSpawn${variant}Jar") ?: file(
