import groovy.json.JsonSlurper
import groovy.xml.XmlSlurper
import java.security.MessageDigest
import java.util.zip.ZipFile
import org.apache.tools.ant.filters.FixCrLfFilter

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

apply from: 'gradle/verify-eclipse-ecj.gradle'

group = project.mod_group
version = project.mod_version
base.archivesName = 'baseSteam'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
        vendor = JvmVendorSpec.ADOPTIUM
    }
    withSourcesJar()
    withJavadocJar()
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '1000', '-proc:none'])
}
tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addBooleanOption('notimestamp', true)
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    includeEmptyDirs = false
}
def archiveTextPatterns = ['**/*.java', '**/*.json', '**/*.mcmeta', '**/*.toml', '**/*.txt', '**/*.md']
def normalizeArchiveLineEndings = { details ->
    details.filter(FixCrLfFilter, eol: FixCrLfFilter.CrLf.newInstance('lf'),
            eof: FixCrLfFilter.AddAsisRemove.newInstance('asis'))
}

sourceSets {
    main.resources.exclude '.cache/**'
    gameTestValidation {
        java.srcDir 'src/gametest/java'
        resources.srcDir 'src/gametest/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gameTestValidationImplementation.extendsFrom implementation
    gameTestValidationCompileOnly.extendsFrom compileOnly
    gameTestValidationRuntimeOnly.extendsFrom runtimeOnly
    runtimeClasspath.extendsFrom localRuntime
    testRuntimeClasspath.extendsFrom localRuntime
    gameTestValidationRuntimeClasspath.extendsFrom localRuntime
}
def steamGameTestRunDirectory = layout.buildDirectory.dir(
        providers.gradleProperty('steamGameTestRunId').orElse('run').map { runId ->
            if (!(runId ==~ /[A-Za-z0-9_-]+/)) throw new GradleException('Invalid Steam GameTest run ID')
            "steam-gametest-${runId}"
        })
neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.gameTestValidation
    mods {
        basesteam { sourceSet sourceSets.main }
        basesteam_tests { sourceSet sourceSets.gameTestValidation }
    }
    runs {
        configureEach {
            systemProperty 'forge.logging.console.level', 'info'
            loadedMods = [mods.basesteam]
        }
        client { client() }
        server { server(); programArgument '--nogui' }
        data {
            data()
            gameDirectory = file('run-data')
            programArguments.addAll(['--mod', mod_id, '--all', '--output',
                    file('src/generated/resources').absolutePath, '--existing', file('src/main/resources').absolutePath])
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTestValidation
            loadedMods = [mods.basesteam, mods.basesteam_tests]
            gameDirectory = steamGameTestRunDirectory.get().asFile
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }
    unitTest {
        enable()
        testedMod = mods.basesteam
        loadedMods = [mods.basesteam]
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'ModDevZone'
        url = uri('https://maven.moddev.zone/releases')
        content { includeGroupByRegex 'zone\\.moddev\\.mc\\..*' }
    }
}
def powerRoot = '../../PowerAdvantage'
def powerAdvantageDeobfJar = file(providers.gradleProperty('powerAdvantageJar')
        .orElse(providers.gradleProperty('powerAdvantageDeobfJar'))
        .getOrElse("${powerRoot}/build/libs/basePower-${project.poweradvantage_version}.jar"))
def baseMetalsJarOverride = providers.gradleProperty('baseMetalsJar')
dependencies {
    implementation files(powerAdvantageDeobfJar)
    implementation "zone.moddev.mc.lib:mmdlib:${project.mmdlib_version}"
    localRuntime "zone.moddev.mc.orespawn:OreSpawn:${project.orespawn_version}"
    if (!providers.gradleProperty('withoutBaseMetals').map { it.toBoolean() }.getOrElse(false)) {
        if (baseMetalsJarOverride.isPresent()) {
            localRuntime files(baseMetalsJarOverride.get())
        } else {
            localRuntime "zone.moddev.mc.basemetals:BaseMetals:${project.basemetals_version}"
        }
    }
    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}
tasks.named('test', Test) {
    useJUnitPlatform()
    maxParallelForks = 1
    doFirst { workingDir projectDir }
    testLogging { events 'failed', 'skipped'; exceptionFormat = 'full' }
}
tasks.named('processResources', ProcessResources) {
    def replacements = [version: project.version, poweradvantage_version: poweradvantage_version,
            minecraft_version_range: minecraft_version_range, neo_version_range: neo_version_range,
            loader_version_range: loader_version_range]
    inputs.properties replacements
    filesMatching('META-INF/neoforge.mods.toml') { expand replacements }
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
}
tasks.named('jar', Jar) {
    manifest.attributes([
            'Maven-Artifact': "${project.group}:${base.archivesName.get()}:${project.version}",
            'Specification-Title': mod_id, 'Specification-Vendor': mod_authors, 'Specification-Version': '1',
            'Implementation-Title': base.archivesName.get(), 'Implementation-Version': project.version,
            'Implementation-Vendor': mod_authors, 'Built-On-Java': java_version,
            'Built-On': "${minecraft_version}-NeoForge-${neo_version}"
    ])
}
tasks.named('sourcesJar', Jar) {
    filesMatching(archiveTextPatterns + ['**/*.cfg', '**/*.properties', '**/*.js'], normalizeArchiveLineEndings)
}
tasks.named('javadocJar', Jar) { filesMatching(archiveTextPatterns, normalizeArchiveLineEndings) }
tasks.register('releaseJar') { dependsOn 'jar', 'verifyNativeDevelopmentDependencies' }
tasks.register('deobfJar') { dependsOn 'jar' }

tasks.register('verifyReleaseConfiguration') {
    group = 'verification'
    doLast {
        if (project.mod_version != '2.2.20.121012' || project.poweradvantage_version != '2.4.19.121012'
                || project.neo_version != '21.1.265' || project.java_version != '21'
                || project.loader_name != 'neoforge' || project.loader_code != '2'
                || project.mmdlib_version != '2.0.2.121012+Neo'
                || project.basemetals_version != '4.0.1.121012+Neo') {
            throw new GradleException('The coordinated NeoForge 1.21.1 candidate versions must not be overridden')
        }
        Properties wrapper = new Properties()
        file('gradle/wrapper/gradle-wrapper.properties').withInputStream { wrapper.load(it) }
        if (!wrapper.distributionUrl.endsWith('/gradle-9.8.0-bin.zip')
                || wrapper.distributionSha256Sum != 'bafd5ce9cfaea0fbccfdc8439a1ac42fbd4cd9c89dc9a988228d8a2639a58e6c') {
            throw new GradleException('Unexpected Gradle wrapper or checksum')
        }
        String wrapperHash = MessageDigest.getInstance('SHA-256').digest(file('gradle/wrapper/gradle-wrapper.jar').bytes)
                .encodeHex().toString()
        if (wrapperHash != '238e777fcddd7e34f9708186085def2abd6e08e658505b38718d79d74c21abd5') {
            throw new GradleException('The wrapper jar must match the official Gradle 9.8.0 checksum')
        }
    }
}
tasks.register('verifyNativeDevelopmentDependencies') {
    group = 'verification'
    inputs.file powerAdvantageDeobfJar
    doLast {
        if (!powerAdvantageDeobfJar.isFile()) throw new GradleException("Build the coordinated Power candidate first: ${powerAdvantageDeobfJar}")
        new ZipFile(powerAdvantageDeobfJar).withCloseable { zip ->
            def metadata = zip.getEntry('META-INF/neoforge.mods.toml')
            if (metadata == null) throw new GradleException('basePower must be a NeoForge mod')
            String text = zip.getInputStream(metadata).getText('UTF-8')
            if (!text.contains(project.poweradvantage_version)) throw new GradleException('Mismatched Power candidate')
            ['zone/moddev/mc/basepower/compat/CrushingRecipes.class', 'cyano/poweradvantage/api/PoweredEntity.class'].each {
                if (zip.getEntry(it) == null) throw new GradleException("Missing shared Power API: ${it}")
            }
        }
        String actual = MessageDigest.getInstance('SHA-256').digest(powerAdvantageDeobfJar.bytes).encodeHex().toString().toUpperCase(Locale.ROOT)
        String expected = providers.gradleProperty('powerAdvantageSha256').getOrElse(project.poweradvantage_sha256)
        if (expected != 'UNQUALIFIED' && (!(expected ==~ /[A-Fa-f0-9]{64}/) || actual != expected.toUpperCase(Locale.ROOT)))
            throw new GradleException("Power candidate checksum mismatch: ${actual}")
        logger.lifecycle("Power candidate SHA-256: ${actual}" + (expected == 'UNQUALIFIED' ? ' (local, not frozen)' : ' (verified)'))
    }
}
tasks.named('compileJava') { dependsOn 'verifyNativeDevelopmentDependencies' }
tasks.register('verifyReleaseArtifacts') {
    group = 'verification'
    dependsOn 'jar', 'sourcesJar', 'javadocJar', 'verifyReleaseConfiguration'
    doLast {
        File player = tasks.jar.archiveFile.get().asFile
        new ZipFile(player).withCloseable { zip ->
            if (zip.getEntry('META-INF/neoforge.mods.toml') == null || zip.getEntry('META-INF/mods.toml') != null)
                throw new GradleException('Unexpected loader metadata')
            zip.entries().each { entry ->
                String name = entry.name
                if (['net/minecraft/', 'net/minecraftforge/', 'net/neoforged/', 'cyano/poweradvantage/',
                     'zone/moddev/mc/basepower/', 'zone/moddev/mc/basemetals/', 'zone/moddev/mc/lib/',
                     'zone/moddev/mc/basesteam/testing/', 'zone/moddev/mc/basesteam/gametest/'].any { name.startsWith(it) }) {
                    throw new GradleException("Dependency or test code embedded in player jar: ${name}")
                }
            }
        }
    }
}
tasks.register('writeReleaseChecksums') {
    dependsOn 'verifyReleaseArtifacts'
    doLast {
        File output = layout.buildDirectory.file('release/SHA256SUMS').get().asFile
        output.parentFile.mkdirs()
        output.text = [tasks.jar, tasks.sourcesJar, tasks.javadocJar].collect {
            File jar = it.archiveFile.get().asFile
            MessageDigest.getInstance('SHA-256').digest(jar.bytes).encodeHex().toString().toUpperCase(Locale.ROOT) + '  ' + jar.name
        }.join('\n') + '\n'
    }
}

tasks.named('runGameTestServer') {
    doFirst {
        File run = steamGameTestRunDirectory.get().asFile
        if (new File(run, 'logs/latest.log').exists()) throw new GradleException('Use a fresh -PsteamGameTestRunId to preserve evidence')
        run.mkdirs()
        project.copy { from 'ci-fixtures/steam-gametest-server.properties'; into run; rename { 'server.properties' } }
    }
    doLast {
        File log = new File(steamGameTestRunDirectory.get().asFile, 'logs/latest.log')
        String text = log.isFile() ? log.getText('UTF-8') : ''
        if (!text.contains('All 10 required tests passed') || (text =~ /\[[^\]\r\n]*\/(?:ERROR|FATAL)\]/).find())
            throw new GradleException("Steam GameTests did not pass cleanly: ${log}")
    }
}

def prepareEclipseResources = tasks.register('prepareEclipseResources', Sync) {
    dependsOn 'processResources'
    from layout.buildDirectory.dir('resources/main')
    into 'bin/main'
}
neoForge.ideSyncTask prepareEclipseResources
eclipse {
    classpath {
        defaultOutputDir = file('bin/main')
        file.whenMerged { cp ->
            cp.entries.findAll { it.kind == 'src' }.each { entry ->
                boolean testSource = entry.path.startsWith('src/test/') || entry.path.startsWith('src/gametest/')
                entry.output = testSource ? 'bin/test' : 'bin/main'
                if (testSource) entry.entryAttributes['test'] = 'true'
            }
        }
    }
}
tasks.register('configureEclipseBuildship') {
    group = 'ide'
    doLast {
        File prefs = file('.settings/org.eclipse.buildship.core.prefs')
        prefs.parentFile.mkdirs()
        Properties settings = new Properties()
        ['eclipse.preferences.version': '1',
         'connection.gradle.distribution': 'GRADLE_DISTRIBUTION(WRAPPER)',
         'connection.gradle.user.home': gradle.gradleUserHomeDir.canonicalPath,
         'gradle.user.home': gradle.gradleUserHomeDir.canonicalPath,
         'java.home': javaToolchains.launcherFor(java.toolchain).get().metadata.installationPath.asFile.canonicalPath,
         'override.workspace.settings': 'true', 'connection.project.dir': ''].each { key, value ->
            settings.setProperty(key, value)
        }
        prefs.withOutputStream { settings.store(it, 'Generated by configureEclipseBuildship') }
    }
}
tasks.named('eclipse') { dependsOn 'configureEclipseBuildship', prepareEclipseResources }
tasks.register('verifyEclipseProductionClasspath') {
    dependsOn 'eclipse'
    doLast {
        def cp = new XmlSlurper().parse(file('.classpath'))
        if (cp.classpathentry.any { it.@path.text().contains('unresolved dependency') })
            throw new GradleException('Eclipse contains unresolved dependencies')
        cp.classpathentry.findAll { it.@kind == 'lib' }.each {
            if (!file(it.@path.text()).isFile()) throw new GradleException("Missing Eclipse library: ${it.@path}")
        }
        cp.classpathentry.findAll { it.@kind == 'src' }.each {
            boolean tests = it.@path.text().startsWith('src/test/') || it.@path.text().startsWith('src/gametest/')
            if (it.@output.text() != (tests ? 'bin/test' : 'bin/main')) throw new GradleException('Mixed Eclipse production/test output')
        }
    }
}

def blocksAtlasPath = 'assets/minecraft/atlases/blocks.json'
def steamBlocksAtlas = [sources: [[type: 'single', resource: 'basesteam:entity/drill_bit']]]
def verifySteamBlocksAtlas = { Object atlas ->
    if (atlas != steamBlocksAtlas) {
        throw new GradleException("${blocksAtlasPath} must stitch only basesteam:entity/drill_bit as a single source")
    }
}
tasks.register('verifyJavaSourceLayout') {
    group = 'verification'
    description = 'Checks package paths in every configured Java source root for Eclipse.'
    doLast {
        sourceSets.each { sourceSet ->
            sourceSet.java.srcDirs.each { root ->
                fileTree(root) { include '**/*.java' }.each { source ->
                    def relativePath = root.toPath().relativize(source.toPath())
                    String expected = relativePath.parent?.collect { it.toString() }?.join('.') ?: ''
                    def declaration = source.getText('UTF-8') =~ /(?m)^\s*package\s+([\w.]+)\s*;/
                    String actual = declaration.find() ? declaration.group(1) : ''
                    if (actual != expected) {
                        throw new GradleException("${sourceSet.name}: ${relativePath} declares '${actual}', "
                                + "but Eclipse expects '${expected}' under ${root}.")
                    }
                }
            }
        }
    }
}

tasks.register('verifyModelAssets') {
    group = 'verification'
    description = 'Verifies baseSteam JSON and model references against packaged assets.'
    dependsOn tasks.named('verifyNativeDevelopmentDependencies')
    File resourceRoot = file('src/main/resources')
    File assetRoot = new File(resourceRoot, "assets/${project.mod_id}")
    File modelRoot = new File(assetRoot, 'models')
    File blockstateRoot = new File(assetRoot, 'blockstates')
    File steamAtlas = new File(resourceRoot, blocksAtlasPath)
    inputs.dir(assetRoot)
    inputs.files(fileTree(resourceRoot) { include blocksAtlasPath })
    inputs.file(powerAdvantageDeobfJar)

    doLast {
        fileTree(assetRoot) { include '**/*.json' }.files.sort().each { File jsonFile ->
            new JsonSlurper().parse(jsonFile)
        }

        Set<String> atlasPrefixes = ['block/', 'item/'] as Set<String>
        Set<String> singleSprites = [] as Set<String>
        if (steamAtlas.isFile()) {
            def atlas = new JsonSlurper().parse(steamAtlas)
            verifySteamBlocksAtlas(atlas)
            singleSprites.addAll(atlas.sources.collect { it.resource })
        }
        Set<String> powerAdvantageAssets = new ZipFile(powerAdvantageDeobfJar).withCloseable { zip ->
            def atlasEntry = zip.getEntry(blocksAtlasPath)
            if (atlasEntry != null) {
                zip.getInputStream(atlasEntry).withCloseable { input ->
                    def atlas = new JsonSlurper().parse(input, 'UTF-8')
                    // Power's directory sources preserve the existing texture IDs across namespaces.
                    atlas.sources.findAll {
                        it.type == 'directory' && it.source instanceof String && it.prefix == it.source + '/'
                    }.each { atlasPrefixes.add(it.prefix) }
                }
            }
            zip.entries().collect { it.name } as Set<String>
        }
        def verifyReference = { String reference, String assetType, String sourcePath ->
            if (reference.startsWith('#')) return
            int separator = reference.indexOf(':')
            String namespace = separator >= 0 ? reference.substring(0, separator) : 'minecraft'
            String path = separator >= 0 ? reference.substring(separator + 1) : reference
            if (namespace != project.mod_id && namespace != 'basepower') return

            String suffix = assetType == 'textures' ? '.png' : '.json'
            String targetPath = "assets/${namespace}/${assetType}/${path}${suffix}"
            boolean present = namespace == project.mod_id
                    ? new File(resourceRoot, targetPath).isFile()
                    : powerAdvantageAssets.contains(targetPath)
            if (!present) {
                throw new GradleException(
                        "${sourcePath} references missing ${assetType} asset ${reference}")
            }
            if (assetType == 'textures' && !singleSprites.contains(reference)
                    && !atlasPrefixes.any { path.startsWith(it) }) {
                throw new GradleException("${sourcePath} references unstitched blocks atlas texture ${reference}")
            }
        }

        fileTree(modelRoot) { include '**/*.json' }.files.sort().each { File modelFile ->
            def model = new JsonSlurper().parse(modelFile)
            if (model.parent instanceof String) {
                verifyReference(model.parent, 'models', modelFile.path)
            }
            if (model.textures instanceof Map) {
                model.textures.values().findAll { it instanceof String }.each { String texture ->
                    verifyReference(texture, 'textures', modelFile.path)
                }
            }
        }

        Closure verifyBlockstateModels
        verifyBlockstateModels = { Object node, String sourcePath ->
            if (node instanceof Map) {
                node.each { key, value ->
                    if (key == 'model' && value instanceof String) {
                        verifyReference(value, 'models', sourcePath)
                    } else {
                        verifyBlockstateModels(value, sourcePath)
                    }
                }
            } else if (node instanceof Collection) {
                node.each { verifyBlockstateModels(it, sourcePath) }
            }
        }
        fileTree(blockstateRoot) { include '**/*.json' }.files.sort().each { File blockstateFile ->
            def blockstate = new JsonSlurper().parse(blockstateFile)
            if (blockstate.containsKey('forge_marker') || (blockstate.variants instanceof Map
                    && (blockstate.variants.containsKey('normal') || blockstate.variants.containsKey('fluid')))) {
                throw new GradleException("${blockstateFile.path} uses removed legacy blockstate selectors")
            }
            verifyBlockstateModels(blockstate, blockstateFile.path)
        }
    }
}

tasks.register('verifyRepositoryHygiene') {
    group = 'verification'
    description = 'Rejects tracked agent context, IDE state, dependencies, and generated output.'
    doLast {
        if (!file('.git').exists()) {
            throw new GradleException('Repository hygiene verification requires a Git checkout')
        }
        List<String> tracked = providers.exec {
            commandLine 'git', 'ls-files'
        }.standardOutput.asText.get().readLines()
        List<String> forbidden = tracked.findAll { path ->
            String normalized = path.replace('\\', '/').toLowerCase(Locale.ROOT)
            String name = normalized.tokenize('/').last()
            normalized.startsWith('agent-notes/')
                    || normalized.startsWith('.agent/')
                    || normalized.startsWith('.agents/')
                    || normalized.startsWith('.codex/')
                    || normalized.startsWith('.claude/')
                    || normalized.startsWith('.cursor/')
                    || normalized.startsWith('.ci-dependencies/')
                    || normalized.startsWith('.settings/')
                    || normalized.startsWith('build/')
                    || normalized.startsWith('bin/')
                    || normalized.startsWith('run/')
                    || name == 'agent.md'
                    || name == 'agents.md'
                    || name == 'claude.md'
                    || name == '.classpath'
                    || name == '.project'
                    || name.endsWith('.launch')
                    || name.startsWith('agent-')
                    || name.startsWith('codex-')
        }
        if (!forbidden.isEmpty()) {
            throw new GradleException("Generated or local files are tracked: ${forbidden}")
        }
    }
}

tasks.register('verifyDataPackLayout') {
    group = 'verification'
    description = 'Rejects obsolete datapack paths and missing data-driven musket enchantments.'
    inputs.dir('src/main/resources/data')
    inputs.dir('src/gametest/resources/data')
    doLast {
        List<String> obsolete = files(fileTree('src/main/resources/data'),
                fileTree('src/gametest/resources/data')).files.collect {
            relativePath(it).replace('\\', '/')
        }.findAll { it ==~ /.*\/data\/[^\/]+\/(?:recipes|advancements|loot_tables|structures)\/.*/
                || it ==~ /.*\/data\/[^\/]+\/tags\/(?:items|blocks)\/.*/ }
        if (!obsolete.isEmpty()) throw new GradleException("Obsolete datapack directories: ${obsolete}")
        if (!file('src/gametest/resources/data/basesteam/structure/basesteam_empty.nbt').isFile()) {
            throw new GradleException('Missing native GameTest structure path')
        }
        ['high_explosive', 'powderless', 'rapid_reload', 'recoil'].each { id ->
            File definition = file("src/main/resources/data/basesteam/enchantment/${id}.json")
            if (!definition.isFile()) throw new GradleException("Missing musket enchantment: ${id}")
            Map value = new JsonSlurper().parse(definition) as Map
            if (value.supported_items != '#basesteam:muskets' || value.slots != ['mainhand']
                    || value.effects != [:]) {
                throw new GradleException("Unexpected native musket enchantment contract: ${id}")
            }
        }
    }
}
tasks.register('verifyRecipeTagGuards') {
    group = 'verification'
    inputs.dir 'src/main/resources/data/basesteam/recipe'
    doLast {
        fileTree('src/main/resources/data/basesteam/recipe').matching { include '*.json' }.each { recipeFile ->
            Map recipe = new JsonSlurper().parse(recipeFile) as Map
            if (recipe.containsKey('forge:condition') || recipe.containsKey('conditions'))
                throw new GradleException("Obsolete loader conditions: ${recipeFile}")
            Set<String> tags = [] as Set<String>
            Closure collectTags
            collectTags = { node ->
                if (node instanceof Map) node.each { key, value ->
                    if (key == 'tag' && value instanceof String) tags.add(value)
                    else collectTags(value)
                }
                else if (node instanceof Collection) node.each { collectTags(it) }
            }
            collectTags(recipe.key ?: recipe.ingredients ?: recipe.ingredient)
            if (tags.any { it.startsWith('forge:') }) throw new GradleException("Obsolete Forge tag: ${recipeFile}")
            def conditions = recipe['neoforge:conditions'] ?: []
            Set<String> guards = conditions.findAll { it.type == 'basepower:tag_not_empty' }.collect { it.tag } as Set<String>
            Set<String> materialTags = tags.findAll { it.startsWith('c:') } as Set<String>
            if (!(materialTags - guards).isEmpty()) throw new GradleException("Missing material-tag guards in ${recipeFile}: ${materialTags - guards}")
        }
    }
}
tasks.named('check') {
    dependsOn 'verifyDataPackLayout', 'verifyJavaSourceLayout', 'verifyReleaseConfiguration',
            'verifyModelAssets', 'verifyRepositoryHygiene', 'verifyRecipeTagGuards'
}
publishing {
    publications { mavenJava(MavenPublication) { artifactId = 'baseSteam'; from components.java } }
}

apply from: 'gradle/verify-native-inputs.gradle'

tasks.named('verifyReleaseArtifacts') {
    doLast {
        File notices = new File(tasks.named('javadoc', Javadoc).get().javadocTool.get()
                .metadata.installationPath.asFile, 'legal/java.base')
        new ZipFile(tasks.named('javadocJar', Jar).get().archiveFile.get().asFile).withCloseable { zip ->
            ['ADDITIONAL_LICENSE_INFO', 'ASSEMBLY_EXCEPTION', 'LICENSE'].each { name ->
                def entry = zip.getEntry('legal/' + name)
                if (entry == null) throw new GradleException('Missing Javadoc legal notice: ' + name)
                String actual = zip.getInputStream(entry).withCloseable { it.getText('UTF-8') }
                String expected = new File(notices, name).getText('UTF-8').replace('\r\n', '\n').replace('\r', '\n')
                if (actual.trim().startsWith('Please see') || actual != expected || actual.length() < 100) {
                    throw new GradleException('Javadoc must contain the full pinned JDK legal notice: ' + name)
                }
            }
            int checked = 0
            zip.entries().findAll { !it.directory && (it.name.startsWith('legal/') || it.name == 'element-list'
                    || it.name ==~ /.*\.(?:html|css|js|json|svg|txt)$/) }.each { entry ->
                String text = zip.getInputStream(entry).withCloseable { it.getText('UTF-8') }
                if (text.contains('\r')) throw new GradleException('Non-LF Javadoc text: ' + entry.name)
                checked++
            }
            logger.lifecycle('Javadoc archive PASS: 3 full JDK legal notices; {} LF text entries.', checked)
        }
    }
}

tasks.named('javadocJar', Jar) { inputs.file('gradle/reproducible-docs.gradle') }

apply from: 'gradle/reproducible-docs.gradle'
