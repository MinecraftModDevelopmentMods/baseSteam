def expectedReleaseFiles = providers.provider {
    def prefix = "${base.archivesName.get()}-${project.version}"
    ["${prefix}.jar", "${prefix}-sources.jar", "${prefix}-javadoc.jar"]
}
def preparedReleaseDir = providers.gradleProperty('preparedReleaseDir')

def verifyPackFormats = { pack ->
    if (pack.pack_format != 15 || pack['forge:server_data_pack_format'] != 15
            || pack.containsKey('forge:resource_pack_format') || pack.containsKey('forge:data_pack_format')) {
        throw new GradleException('Minecraft 1.20.1 requires resource and data pack format 15')
    }
}

tasks.register('verifyReleaseConfiguration') {
    group = 'verification'
    description = 'Validates release identity, target metadata, and dependency policy.'
    doLast {
        verifyPackFormats(new JsonSlurper().parse(file('src/main/resources/pack.mcmeta')).pack)
        if (project.mod_version != '2.2.13.120011') {
            throw new GradleException("Unexpected baseSteam release version: ${project.mod_version}")
        }
        if (project.minecraft_version != '1.20.1' || project.minecraft_version_range != '[1.20.1]'
                || project.forge_version != '47.4.10' || project.forge_version_range != '[47.4.10,48)'
                || project.loader_version_range != '[47,48)'
                || project.mapping_channel != 'official'
                || project.mapping_version != '1.20.1'
                || project.mcp_version != '20230612.114412') {
            throw new GradleException('Unexpected Minecraft, Forge, or mappings target')
        }
        if (project.loader_name != 'forge' || project.loader_code != '1'
                || project.java_version != '17'
                || project.java_toolchain_version != '17.0.1+12'
                || project.java_setup_version != '17.0.1+12'
                || project.gradle_java_version != '17') {
            throw new GradleException('Unexpected release dispatcher target metadata')
        }
        if (project.mod_id != 'basesteam'
                || project.mod_name != 'baseSteam'
                || project.group.toString() != 'zone.moddev.mc.basesteam'
                || base.archivesName.get() != 'baseSteam'
                || project.mod_license != 'GPL-3.0-only'
                || project.curseforge_project_id != '1781373') {
            throw new GradleException('Unexpected Forge, Maven, archive, or CurseForge identity')
        }
        if (project.cf_requirements != 'basepower,base-metals'
                || project.cf_optionals != ''
                || project.cf_versions != '1.20.1') {
            throw new GradleException('Unexpected CurseForge dependency or game-version metadata')
        }
        if (project.basemetals_version != '3.1.2.120011'
                || project.orespawn_version != '4.1.0.120011') {
            throw new GradleException('Unexpected development API versions')
        }
        if (project.poweradvantage_version != '2.4.12.120011'
                || project.poweradvantage_source_repository != 'MinecraftModDevelopmentMods/basePower') {
            throw new GradleException('Unexpected basePower compile dependency identity')
        }
        String mainSource = file(
                'src/main/java/zone/moddev/mc/basesteam/SteamAdvantage.java').getText('UTF-8')
        if (!mainSource.contains('MODID = "basesteam"')
                || !mainSource.contains('VERSION = "2.2.13.120011"')) {
            throw new GradleException('baseSteam source identity changed')
        }
        String metadata = file('src/main/resources/META-INF/mods.toml').getText('UTF-8').replace('\r\n', '\n')
        ['modId="basesteam"', 'displayName="baseSteam"',
         'modId="basepower"\nmandatory=true\nversionRange="[2.4.12.120011,3.0.0)"',
         'modId="basemetals"\nmandatory=false\nversionRange="[3.1.2.120011,4.0.0)"'].each { marker ->
            if (!metadata.contains(marker)) {
                throw new GradleException("Source mods.toml is missing ${marker}")
            }
        }
    }
}

def auditJar = { File jarFile, String property, String hashPin, String modId, String expectedVersion,
                 List<String> required ->
    String expectedHash = committedPin(hashPin, /[A-F0-9]{64}/)
    if (jarFile == null || !jarFile.isFile()) {
        throw new GradleException("Supply the pinned ${modId} jar via -P${property}=<path>.")
    }
    String actualHash = MessageDigest.getInstance('SHA-256')
            .digest(jarFile.bytes).encodeHex().toString().toUpperCase(Locale.ROOT)
    if (actualHash != expectedHash) {
        throw new GradleException("${modId} SHA-256 is ${actualHash}, expected ${expectedHash}")
    }
    new ZipFile(jarFile).withCloseable { zip ->
        (['META-INF/MANIFEST.MF', 'META-INF/mods.toml'] + required).each { entry ->
            if (zip.getEntry(entry) == null) {
                throw new GradleException("${modId} dependency is missing ${entry}")
            }
        }
        def manifest = new Manifest(zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF'))).mainAttributes
        if (manifest.getValue('Implementation-Version') != expectedVersion
                || manifest.getValue('Built-On') != "${project.minecraft_version}-${project.forge_version}"
                || manifest.getValue('Built-On-Java') != '17') {
            throw new GradleException("${modId} must be ${expectedVersion} for Forge ${project.forge_version} and Java 17")
        }
        String metadata = zip.getInputStream(zip.getEntry('META-INF/mods.toml')).getText('UTF-8')
        if (!metadata.readLines().any { it.startsWith("modId=\"${modId}\"") }) {
            throw new GradleException("${modId} dependency declares a different mod identity")
        }
    }
    logger.lifecycle("${modId}: ${jarFile.canonicalPath} SHA-256 ${actualHash}")
}

