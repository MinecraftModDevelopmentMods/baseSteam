tasks.named('processResources', ProcessResources) {
    filteringCharset = 'UTF-8'
    inputs.properties([
            version: project.version,
            minecraft_version_range: project.minecraft_version_range,
            forge_version_range: project.forge_version_range,
            loader_version_range: project.loader_version_range
    ])
    filesMatching('META-INF/mods.toml') {
        expand version: project.version,
                minecraft_version_range: project.minecraft_version_range,
                forge_version_range: project.forge_version_range,
                loader_version_range: project.loader_version_range
    }
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
}

def committedPin = { String key, pattern ->
    Properties pins = new Properties()
    file('gradle.properties').withInputStream { pins.load(it) }
    String pinned = pins.getProperty(key, '')
    if (!(pinned ==~ pattern) || project.property(key) != pinned) {
        throw new GradleException("Supply the exact coordinated ${key} in gradle.properties; overrides are not accepted.")
    }
    pinned
}
def forgeCapabilityBootstrapJar = providers.gradleProperty('forgeCapabilityBootstrapJar')
        .map { file(it) }
        .orElse(file("${powerRoot}/build/unit-bootstrap/forge-native-unit-bootstrap.jar"))
tasks.withType(Test).configureEach {
    inputs.files(forgeCapabilityBootstrapJar)
    inputs.property('powerBootstrapSha256', providers.gradleProperty('poweradvantage_test_bootstrap_sha256'))
    doFirst {
        File bootstrapJar = forgeCapabilityBootstrapJar.getOrNull()
        if (bootstrapJar == null || !bootstrapJar.isFile()) {
            throw new GradleException('Supply the verified basePower test bootstrap via -PforgeCapabilityBootstrapJar=<path>')
        }
        String expectedHash = committedPin('poweradvantage_test_bootstrap_sha256', /[A-F0-9]{64}/)
        String actualHash = MessageDigest.getInstance('SHA-256').digest(bootstrapJar.bytes)
                .encodeHex().toString().toUpperCase(Locale.ROOT)
        if (actualHash != expectedHash) {
            throw new GradleException("basePower test bootstrap SHA-256 is ${actualHash}, expected ${expectedHash}")
        }
        new ZipFile(bootstrapJar).withCloseable { zip ->
            def manifest = new Manifest(zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF'))).mainAttributes
            if (manifest.getValue('Premain-Class') != 'zone.moddev.mc.advantageworks.unit.ForgeCapabilityBootstrap') {
                throw new GradleException('Unexpected native capability test bootstrap entry point')
            }
        }
        logger.lifecycle("basePower test bootstrap: ${bootstrapJar.canonicalPath} SHA-256 ${actualHash}")
        jvmArgs "-javaagent:${bootstrapJar.canonicalPath}"
    }
}

def prepareEclipseResources = tasks.register('prepareEclipseResources') {
    group = 'ide'
    description = 'Copies Gradle-processed resources into Eclipse production output.'
    dependsOn tasks.named('processResources')
    doLast {
        project.copy {
            from(layout.buildDirectory.dir('resources/main'))
            into(layout.projectDirectory.dir('bin/main'))
        }
    }
}

tasks.named('jar', Jar) {
    archiveClassifier = 'deobf'
    destinationDirectory = layout.buildDirectory.dir('libs-dev')
    exclude 'fernflower_abstract_parameter_names.txt'
    manifest {
        attributes([
                'Maven-Artifact'        : "${project.group}:${base.archivesName.get()}:${project.version}",
                'Specification-Title'   : project.mod_id,
                'Specification-Vendor'  : project.mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : base.archivesName.get(),
                'Implementation-Version': project.version,
                'Implementation-Vendor' : project.mod_authors,
                'Built-On-Java'         : project.java_version,
                'Built-On'              : "${project.minecraft_version}-${project.forge_version}"
        ])
    }
}

def renamedJar = renamer.classes(tasks.named('jar', Jar)) {
    map.from minecraft.dependency.toSrgFile
    archiveClassifier = 'renamed'
    output.set(layout.buildDirectory.file(
            "intermediates/renamed/${base.archivesName.get()}-${project.version}.jar"))
}

// Renamer adds an internal Fernflower parameter map. Repack its output so the
// public jar is deterministic and contains only the mod plus its own manifest.
def releaseJar = tasks.register('releaseJar', Jar) {
    dependsOn renamedJar, 'verifyReleaseDependencies'
    archiveClassifier = null
    destinationDirectory = layout.buildDirectory.dir('libs')
    from({ zipTree(renamedJar.get().output.get().asFile) }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'fernflower_abstract_parameter_names.txt'
    }
    manifest {
        attributes([
                'Maven-Artifact'        : "${project.group}:${base.archivesName.get()}:${project.version}",
                'Specification-Title'   : project.mod_id,
                'Specification-Vendor'  : project.mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : base.archivesName.get(),
                'Implementation-Version': project.version,
                'Implementation-Vendor' : project.mod_authors,
                'Built-On-Java'         : project.java_version,
                'Built-On'              : "${project.minecraft_version}-${project.forge_version}"
        ])
    }
}

tasks.register('deobfJar') {
    group = 'build'
    description = 'Builds the deobfuscated development jar under build/libs-dev.'
    dependsOn tasks.named('jar')
}

tasks.named('compileJava') {
    dependsOn 'verifyNativeDevelopmentDependencies'
}

tasks.named('sourcesJar', Jar) {
    filteringCharset = 'UTF-8'
    includeEmptyDirs = false
    archiveClassifier = 'sources'
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
    manifest {
        attributes([
                'Maven-Artifact'        : "${project.group}:${base.archivesName.get()}:${project.version}:sources",
                'Implementation-Title'  : "${base.archivesName.get()}-sources",
                'Implementation-Version': project.version
        ])
    }
}

tasks.named('javadocJar', Jar) {
    filteringCharset = 'UTF-8'
    archiveClassifier = 'javadoc'
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
    manifest {
        attributes([
                'Maven-Artifact'        : "${project.group}:${base.archivesName.get()}:${project.version}:javadoc",
                'Implementation-Title'  : "${base.archivesName.get()}-javadoc",
                'Implementation-Version': project.version
