name: Publish to MMD Maven

on:
  workflow_dispatch:
    inputs:
      version:
        description: Approved version from .github/maven-release/releases.json
        required: true
        type: string
      mode:
        description: Verify the release, or publish it to MMD Maven
        default: check-only
        required: true
        type: choice
        options:
          - check-only
          - publish

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: mmd-maven-publication
  cancel-in-progress: false

jobs:
  maven:
    name: Verify and publish Maven artifacts
    if: github.repository == 'MinecraftModDevelopmentMods/baseSteam' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Set the temporary publication directory
        run: echo "RELEASE_WORK=$RUNNER_TEMP/maven-release" >> "$GITHUB_ENV"

      - name: Check out the publication workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Java for the standalone Gradle publisher
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify CurseForge and the sealed CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/maven-release/verify.py stage "$RELEASE_VERSION" "$RELEASE_WORK"

      - name: Generate the POM and check the public destination
        id: preflight
        run: |
          bash gradlew -p .github/maven-release generatePomFileForMavenJavaPublication \
            "-PreleaseVersion=$RELEASE_VERSION" "-PreleaseWork=$RELEASE_WORK" --no-daemon
          state=$(python3 .github/maven-release/verify.py check "$RELEASE_VERSION" "$RELEASE_WORK")
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "Verified the CI and CurseForge bytes for $RELEASE_VERSION. Maven destination: $state." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish only to MMD Maven
        if: inputs.mode == 'publish' && steps.preflight.outputs.state == 'absent'
        env:
          MAVEN_UPLOAD_URL: ${{ secrets.MAVEN_UPLOAD_URL }}
          MAVEN_UPLOAD_USERNAME: ${{ secrets.MAVEN_UPLOAD_USERNAME }}
          MAVEN_UPLOAD_PASSWORD: ${{ secrets.MAVEN_UPLOAD_PASSWORD }}
        run: |
          python3 .github/maven-release/verify.py require-absent "$RELEASE_VERSION" "$RELEASE_WORK"
          bash gradlew -p .github/maven-release publishMavenJavaPublicationToReleaseRepository \
            "-PreleaseVersion=$RELEASE_VERSION" "-PreleaseWork=$RELEASE_WORK" --no-daemon

      - name: Verify public Maven downloads
        if: inputs.mode == 'publish'
        run: |
          python3 .github/maven-release/verify.py verify "$RELEASE_VERSION" "$RELEASE_WORK" | tee -a "$GITHUB_STEP_SUMMARY"
