name: Steam Advantage 1.12 CI

on:
  push:
    branches:
      - master-1.12.2
      - 'feature/**'
  pull_request:
    branches:
      - master-1.12.2

permissions:
  contents: read

concurrency:
  group: basesteam-1.12-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out SteamAdvantage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out pinned PowerAdvantage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MinecraftModDevelopmentMods/basePower
          ref: 2913aba3d3f4f3b40594dfad8fcdef6bf61f6bcb
          path: .ci-dependencies/PowerAdvantage

      - name: Check out pinned OreSpawn
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MinecraftModDevelopmentMods/OreSpawn
          ref: 72205b9bb6bfff17cf69715c0d5bd4d2efd3b148
          path: .ci-dependencies/OreSpawn
          persist-credentials: false

      - name: Install Java 8 toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8.0.502+7'

      - name: Install Java 17 for Gradle
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Build pinned OreSpawn development jar
        id: orespawn
        shell: bash
        run: |
          set -euo pipefail
          dependency="$GITHUB_WORKSPACE/.ci-dependencies/OreSpawn"
          chmod +x "$dependency/gradlew"
          (
            cd "$dependency"
            ./gradlew deobfJar --no-daemon --stacktrace
          )
          jar="$dependency/build/libs-dev/OreSpawn-4.1.3.112021-deobf.jar"
          test -f "$jar"
          echo "jar=$jar" >> "$GITHUB_OUTPUT"

      - name: Build pinned PowerAdvantage development jar
        id: basepower
        shell: bash
        run: |
          set -euo pipefail
          dependency="$GITHUB_WORKSPACE/.ci-dependencies/PowerAdvantage"
          mirror="$RUNNER_TEMP/reborncore-mirror"
          chmod +x "$dependency/gradlew"
          (
            cd "$dependency"
            bash gradle/stage-reborncore-release.sh "$mirror"
            ./gradlew deobfJar verifyReleaseDependencies \
              -PoreSpawnDeobfJar="${{ steps.orespawn.outputs.jar }}" \
              -PrebornCoreVerificationRepository="$mirror" --no-daemon --stacktrace
          )
          jar="$dependency/build/libs-dev/basePower-2.4.4.112021-deobf.jar"
          test -f "$jar"
          echo "jar=$jar" >> "$GITHUB_OUTPUT"

      - name: Build and audit release artifacts
        run: >-
          ./gradlew clean check build javadoc verifyReleaseDependencies verifyReleaseArtifacts
          writeReleaseChecksums verifyEclipseProductionClasspath
          -PoreSpawnDeobfJar="${{ steps.orespawn.outputs.jar }}"
          -PpowerAdvantageDeobfJar=${{ steps.basepower.outputs.jar }}
          --no-daemon --stacktrace

      - name: Upload audited release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: baseSteam-1.12.2-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/libs/baseSteam-2.2.6.112021.jar
            build/libs/baseSteam-2.2.6.112021-sources.jar
            build/libs/baseSteam-2.2.6.112021-javadoc.jar
            build/release/SHA256SUMS
            CHANGELOG.txt

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: baseSteam-1.12.2-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/test-results/**
            build/reports/**
            build/*-run/logs/**
            build/problems/**
            .ci-dependencies/PowerAdvantage/build/reports/**
