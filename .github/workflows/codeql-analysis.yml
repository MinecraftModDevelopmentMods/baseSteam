name: CodeQL

on:
  push:
    branches: [master-1.13.2, 'feature/**']
  pull_request:
    branches: [master-1.13.2]
  schedule:
    - cron: '53 7 * * 4'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out SteamAdvantage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check out pinned OreSpawn
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MinecraftModDevelopmentMods/OreSpawn
          ref: 6a7c2bb07b9a7771128812fcc07d185f7d9df58b
          path: .ci-dependencies/OreSpawn
      - name: Use canonical LF dependency inputs
        # Base Metals predates archive text normalization; its LF artifact is separately pinned.
        run: git config --global core.autocrlf false
      - name: Read dependency source pins
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          bm=$(sed -n 's/^basemetals_source_commit=//p' gradle.properties)
          power=$(sed -n 's/^basepower_source_ref=//p' gradle.properties)
          [[ "$bm" =~ ^[a-f0-9]{40}$ && "$power" =~ ^[a-f0-9]{40}$ ]]
          echo "basemetals=$bm" >> "$GITHUB_OUTPUT"
          echo "power=$power" >> "$GITHUB_OUTPUT"
      - name: Check out pinned Base Metals
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MinecraftModDevelopmentMods/BaseMetals
          ref: ${{ steps.pins.outputs.basemetals }}
          path: .ci-dependencies/BaseMetals
      - name: Check out PowerAdvantage 1.13.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MinecraftModDevelopmentMods/basePower
          ref: ${{ steps.pins.outputs.power }}
          path: .ci-dependencies/PowerAdvantage
      - name: Install Java 25 for Mavenizer
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'
      - name: Install Java 8 toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8.0.502+7'
      - name: Install Java 17 for Gradle
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Build 1.13.2 dependency chain
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          orespawn="$GITHUB_WORKSPACE/.ci-dependencies/OreSpawn"
          basemetals="$GITHUB_WORKSPACE/.ci-dependencies/BaseMetals"
          power="$GITHUB_WORKSPACE/.ci-dependencies/PowerAdvantage"
          chmod +x "$orespawn/gradlew" "$basemetals/gradlew" "$power/gradlew"
          (cd "$orespawn" && ./gradlew jar --no-daemon --stacktrace)
          mirror="$RUNNER_TEMP/orespawn-mirror"
          (cd "$basemetals" && bash gradle/stage-orespawn-release.sh "$mirror" &&
            ./gradlew jar "-PorespawnVerificationRepository=$mirror" --no-daemon --stacktrace)
          osjar="$orespawn/build/libs-dev/OreSpawn-4.1.0.113021-deobf.jar"
          bm_version=$(sed -n 's/^basemetals_version=//p' gradle.properties)
          bmjar="$basemetals/build/libs-dev/BaseMetals-$bm_version-deobf.jar"
          (cd "$power" && ./gradlew jar verifyReleaseDependencies \
            -PbaseMetalsDeobfJar="$bmjar" -PoreSpawnDeobfJar="$osjar" --no-daemon --stacktrace)
          powerjar="$power/build/libs-dev/basePower-2.4.5.113021-deobf.jar"
          test -f "$osjar" && test -f "$bmjar" && test -f "$powerjar"
          echo "orespawn=$osjar" >> "$GITHUB_OUTPUT"
          echo "basemetals=$bmjar" >> "$GITHUB_OUTPUT"
          echo "power=$powerjar" >> "$GITHUB_OUTPUT"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: java-kotlin
      - name: Compile SteamAdvantage production code
        run: |
          chmod +x ./gradlew
          ./gradlew clean classes --rerun-tasks --no-build-cache --no-daemon --stacktrace \
            -PpowerAdvantageDeobfJar=${{ steps.dependencies.outputs.power }} \
            -PbaseMetalsDeobfJar=${{ steps.dependencies.outputs.basemetals }} \
            -PoreSpawnDeobfJar=${{ steps.dependencies.outputs.orespawn }}
      - name: Analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
