name: CodeQL

on:
  push:
    branches:
      - master-1.12.2
      - 'feature/**'
  pull_request:
    branches:
      - master-1.12.2
  schedule:
    - cron: '53 7 * * 4'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out SteamAdvantage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out pinned PowerAdvantage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MinecraftModDevelopmentMods/basePower
          ref: 2913aba3d3f4f3b40594dfad8fcdef6bf61f6bcb
          path: .ci-dependencies/PowerAdvantage

      - name: Check out pinned OreSpawn
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MinecraftModDevelopmentMods/OreSpawn
          ref: 72205b9bb6bfff17cf69715c0d5bd4d2efd3b148
          path: .ci-dependencies/OreSpawn
          persist-credentials: false

      - name: Install Java 8 toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8.0.502+7'

      - name: Install Java 17 for Gradle
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Build pinned OreSpawn development jar
        id: orespawn
        shell: bash
        run: |
          set -euo pipefail
          dependency="$GITHUB_WORKSPACE/.ci-dependencies/OreSpawn"
          chmod +x "$dependency/gradlew"
          (
            cd "$dependency"
            ./gradlew deobfJar --no-daemon --stacktrace
          )
          jar="$dependency/build/libs-dev/OreSpawn-4.1.3.112021-deobf.jar"
          test -f "$jar"
          echo "jar=$jar" >> "$GITHUB_OUTPUT"

      - name: Build pinned PowerAdvantage development jar
        id: basepower
        shell: bash
        run: |
          set -euo pipefail
          dependency="$GITHUB_WORKSPACE/.ci-dependencies/PowerAdvantage"
          mirror="$RUNNER_TEMP/reborncore-mirror"
          chmod +x "$dependency/gradlew"
          (
            cd "$dependency"
            bash gradle/stage-reborncore-release.sh "$mirror"
            ./gradlew deobfJar verifyReleaseDependencies \
              -PoreSpawnDeobfJar="${{ steps.orespawn.outputs.jar }}" \
              -PrebornCoreVerificationRepository="$mirror" --no-daemon --stacktrace
          )
          jar="$dependency/build/libs-dev/basePower-2.4.4.112021-deobf.jar"
          test -f "$jar"
          echo "jar=$jar" >> "$GITHUB_OUTPUT"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: java-kotlin

      - name: Compile SteamAdvantage production code
        run: |
          chmod +x ./gradlew
          ./gradlew clean classes --rerun-tasks --no-build-cache --no-daemon --stacktrace \
            -PoreSpawnDeobfJar="${{ steps.orespawn.outputs.jar }}" \
            -PpowerAdvantageDeobfJar=${{ steps.basepower.outputs.jar }}

      - name: Analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
