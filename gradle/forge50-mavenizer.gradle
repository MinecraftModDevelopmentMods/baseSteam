import java.security.MessageDigest
import org.gradle.jvm.toolchain.JvmVendorSpec

// Use the sealed OreSpawn 1.20.6 fixture; Forge 50 needs no source repairs.
def tool = 'ci-fixtures/tools/minecraft-mavenizer-0.5.21-orespawn-compat.jar'
def defaultJar = "../../../../MinecraftMineralogy/OS1206/OreSpawn/${tool}"
def fixture = file(providers.gradleProperty('forge50MavenizerJar').getOrElse(defaultJar))
def expected = '4B14145595E900F178A082F2253A756F63897E6F61C2B8B5E7C819B82CD79E8C'
if (!fixture.isFile()) {
    throw new GradleException("Forge 50 requires OreSpawn's Mavenizer fixture: ${fixture}. "
            + "Use -Pforge50MavenizerJar=<path to ${tool}> for another checkout layout.")
}
def actual = MessageDigest.getInstance('SHA-256').digest(fixture.bytes).encodeHex().toString().toUpperCase(Locale.ROOT)
if (actual != expected) {
    throw new GradleException("Forge 50 Mavenizer fixture SHA-256 mismatch: expected ${expected}, got ${actual}")
}

fgtools.configure('mavenizer') {
    classpath.from(fixture)
    mainClass.set('net.minecraftforge.mcmaven.cli.Main')
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.ADOPTIUM
    })
}
