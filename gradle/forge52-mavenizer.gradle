import java.security.MessageDigest
import org.gradle.jvm.toolchain.JvmVendorSpec

// Use OreSpawn's checksum-verified fixture for the native Forge 52 toolchain.
def tool = 'ci-fixtures/tools/minecraft-mavenizer-0.5.21-orespawn-compat.jar'
def defaultJar = "../../../../MinecraftMineralogy/OS1211/OreSpawn/${tool}"
def fixture = file(providers.gradleProperty('forge52MavenizerJar').getOrElse(defaultJar))
def expected = '019032A4A26ECB473D403EF017054D5892CE59A9904E8831B452287CD756397E'
if (!fixture.isFile()) {
    throw new GradleException("Forge 52 requires OreSpawn's Mavenizer fixture: ${fixture}. "
            + "Use -Pforge52MavenizerJar=<path to ${tool}> for another checkout layout.")
}
def actual = MessageDigest.getInstance('SHA-256').digest(fixture.bytes).encodeHex().toString().toUpperCase(Locale.ROOT)
if (actual != expected) {
    throw new GradleException("Forge 52 Mavenizer fixture SHA-256 mismatch: expected ${expected}, got ${actual}")
}

fgtools.configure('mavenizer') {
    classpath.from(fixture)
    mainClass.set('net.minecraftforge.mcmaven.cli.Main')
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.ADOPTIUM
    })
}
