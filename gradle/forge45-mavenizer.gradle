import java.security.MessageDigest
import org.gradle.jvm.toolchain.JvmVendorSpec

// OreSpawn's Forge 45 fixture fixes eight decompiled record accessors.
def tool = 'ci-fixtures/tools/minecraft-mavenizer-0.5.21-orespawn-compat.jar'
def defaultJar = "../../../../MinecraftMineralogy/OS119/OreSpawn/${tool}"
def fixture = file(providers.gradleProperty('forge45MavenizerJar').getOrElse(defaultJar))
def expected = '341B3FB10ABA6EA7DC612FBE519DC290A1C81867AED5DD320ACD783688AC49DE'
if (!fixture.isFile()) {
    throw new GradleException("Forge 45 requires OreSpawn's Mavenizer fixture: ${fixture}. "
            + "Use -Pforge45MavenizerJar=<path to ${tool}> for another checkout layout.")
}
def actual = MessageDigest.getInstance('SHA-256').digest(fixture.bytes).encodeHex().toString().toUpperCase(Locale.ROOT)
if (actual != expected) {
    throw new GradleException("Forge 45 Mavenizer fixture SHA-256 mismatch: expected ${expected}, got ${actual}")
}

fgtools.configure('mavenizer') {
    classpath.from(fixture)
    mainClass.set('net.minecraftforge.mcmaven.cli.Main')
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.ADOPTIUM
    })
}
