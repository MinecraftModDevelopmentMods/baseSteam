import java.security.MessageDigest
import org.gradle.jvm.toolchain.JvmVendorSpec

// Use OreSpawn's checksum-verified fixture for the native Forge 61 toolchain.
def tool = 'ci-fixtures/tools/minecraft-mavenizer-0.5.21-orespawn-compat.jar'
def defaultJar = "../../../../MinecraftMineralogy/OS12111/OreSpawn/${tool}"
def fixture = file(providers.gradleProperty('forge61MavenizerJar').getOrElse(defaultJar))
def expected = 'B36CA046DB72E30F27BD38E02B4AE34274ADB51AE1D65BAF9E1D07763755682E'
if (!fixture.isFile()) {
    throw new GradleException("Forge 61 requires OreSpawn's Mavenizer fixture: ${fixture}. "
            + "Use -Pforge61MavenizerJar=<path to ${tool}> for another checkout layout.")
}
def actual = MessageDigest.getInstance('SHA-256').digest(fixture.bytes).encodeHex().toString().toUpperCase(Locale.ROOT)
if (actual != expected) {
    throw new GradleException("Forge 61 Mavenizer fixture SHA-256 mismatch: expected ${expected}, got ${actual}")
}
def rules = new File(fixture.parentFile, 'minecraft-source-compatibility.json')
def rulesHash = '88F2EE4C6B7C903EB1C7D693C0BEEFC0EFC601C1023FB197F7CBA187B1142DB7'
if (!rules.isFile() || MessageDigest.getInstance('SHA-256').digest(rules.bytes)
        .encodeHex().toString().toUpperCase(Locale.ROOT) != rulesHash) {
    throw new GradleException("Forge 61 Mavenizer source rules mismatch: ${rules}")
}

fgtools.configure('mavenizer') {
    classpath.from(fixture)
    mainClass.set('net.minecraftforge.mcmaven.cli.Main')
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.ADOPTIUM
    })
}
